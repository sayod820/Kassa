<!DOCTYPE html>
<html lang="ru">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

input,button,select{font-family:inherit}

<body>
<div id="root"></div>
<script type="text/babel">

const C = {
  bg:"#09090f",bg2:"#111120",bg3:"#18182e",border:"#1e1e38",
  text:"#eeeeff",muted:"#6868a0",dim:"#32324a",
  green:"#3ecf8e",red:"#f04f5a",orange:"#f09040",blue:"#4466ff",yellow:"#e8c040"
};

const OFF=5*3600000;
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const tod=()=>{const d=new Date(Date.now()+OFF);return d.toISOString().slice(0,10);};
const monStr=()=>{const d=new Date(Date.now()+OFF);return d.toISOString().slice(0,7);};
const fmt=n=>(+n||0).toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD=d=>{if(!d)return"";return new Date(d+"T00:00:00").toLocaleDateString("ru-RU",{day:"2-digit",month:"short",year:"numeric"});};
const fmtDT=s=>{if(!s)return"";try{let ts=String(s).replace(" ","T");if(!/[Z+]/.test(ts.slice(10)))ts+="Z";const ms=new Date(ts).getTime();if(isNaN(ms))return"";const d=new Date(ms+OFF);return new Date(d.getTime()).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",timeZone:"UTC"})+" "+String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0");}catch(e){return"";}};
const dLeft=d=>{if(!d)return 999;return Math.ceil((new Date(d)-new Date(tod()))/86400000);};
const eColor=n=>n<0?C.red:n<=3?C.orange:n<=7?C.yellow:C.green;
const eText=n=>n<0?"просрочен "+Math.abs(n)+"д":n===0?"сегодня!":n+" дн.";
const inits=n=>(n||"").trim().split(" ").map(w=>w[0]||"").join("").slice(0,2).toUpperCase()||"?";
const getMonths=n=>{const r=[],d=new Date();for(let i=0;i<n;i++){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0");r.push({val:y+"-"+m,label:d.toLocaleDateString("ru-RU",{month:"long",year:"2-digit"})});d.setMonth(d.getMonth()-1);}return r;};
const weekStart=()=>{const d=new Date(Date.now()+OFF),day=d.getDay()||7;d.setDate(d.getDate()-day+1);return d.toISOString().slice(0,10);};

const SB="https://lozieoldpkezxonrxwry.supabase.co/rest/v1";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxvemllb2xkcGtlenhvbnJ4d3J5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMzY0MjEsImV4cCI6MjA5MzYxMjQyMX0.sS5Z8i1xFdv6YiKrpL9Y2sTWEo6Yk3K9TqQhv4HNwts";
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"};
const sbGet=(t,q)=>fetch(SB+"/"+t+"?"+(q||""),{headers:H}).then(r=>r.json());
const sbPost=(t,b)=>fetch(SB+"/"+t,{method:"POST",headers:H,body:JSON.stringify(b)}).then(r=>r.json());
const sbPatch=(t,id,b)=>fetch(SB+"/"+t+"?id=eq."+id,{method:"PATCH",headers:H,body:JSON.stringify(b)});
const sbDel=(t,id)=>fetch(SB+"/"+t+"?id=eq."+id,{method:"DELETE",headers:H});

const DB={suppliers:[],deliveries:[],delivery_items:[],products:[],revisions:[],revision_items:[],expenses:[],revenue:[],cash_movements:[],debt_people:[],debt_transactions:[]};
let _subs=[];
const pub=()=>_subs.forEach(f=>f());
const sub=f=>{_subs.push(f);return()=>{_subs=_subs.filter(x=>x!==f);};};
function dbGet(k){return DB[k]||[];}
async function dbInsert(table,row){const res=await sbPost(table,row);const ins=Array.isArray(res)?res[0]:res;DB[table]=[ins,...DB[table]];pub();return ins;}
async function dbInsertMany(table,rows){if(!rows.length)return;const res=await sbPost(table,rows);DB[table]=[...(Array.isArray(res)?res:[]),...DB[table]];pub();}
async function dbDelete(table,id){await sbDel(table,id);DB[table]=DB[table].filter(r=>r.id!==id);pub();}

async function initDB(){
  try{
    const PAGE=1000;let prods=[],p=0;
    while(true){const b=await sbGet("products","select=*&order=name.asc&limit="+PAGE+"&offset="+(p*PAGE));if(!Array.isArray(b)||!b.length)break;prods=[...prods,...b];if(b.length<PAGE)break;p++;}
    const [sup,del,di,rev,ri,exp,rvn,cm]=await Promise.all([
      sbGet("suppliers","select=*&order=created_at.desc"),sbGet("deliveries","select=*&order=created_at.desc"),
      sbGet("delivery_items","select=*&order=created_at.desc"),sbGet("revisions","select=*&order=created_at.desc"),
      sbGet("revision_items","select=*"),sbGet("expenses","select=*&order=created_at.desc"),
      sbGet("revenue","select=*&order=created_at.desc"),sbGet("cash_movements","select=*&order=created_at.desc"),
    ]);
    DB.suppliers=Array.isArray(sup)?sup:[];DB.deliveries=Array.isArray(del)?del:[];
    DB.delivery_items=Array.isArray(di)?di:[];DB.products=prods;
    DB.revisions=Array.isArray(rev)?rev:[];DB.revision_items=Array.isArray(ri)?ri:[];
    DB.expenses=Array.isArray(exp)?exp:[];DB.revenue=Array.isArray(rvn)?rvn:[];
    DB.cash_movements=Array.isArray(cm)?cm:[];
  }catch(e){console.error(e);}
  try{
    const [dp,dtx]=await Promise.all([sbGet("debt_people","select=*&order=created_at.desc"),sbGet("debt_transactions","select=*&order=created_at.desc")]);
    DB.debt_people=Array.isArray(dp)?dp:[];DB.debt_transactions=Array.isArray(dtx)?dtx:[];
  }catch(e){DB.debt_people=[];DB.debt_transactions=[];}
}

const Card=({children,style})=><div style={{background:C.bg2,border:"1px solid "+C.border,borderRadius:18,padding:16,marginBottom:10,...style}}>{children}</div>;
const FL=({children})=><div style={{fontSize:9,fontWeight:800,letterSpacing:2,textTransform:"uppercase",color:C.dim,marginBottom:6}}>{children}</div>;
const TI=({label,value,onChange,type,placeholder,autoFocus})=>(<div style={{marginBottom:12}}>{label&&<FL>{label}</FL>}<input autoFocus={autoFocus} type={type||"text"} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%",background:C.bg,border:"1px solid "+C.border,borderRadius:12,padding:"13px 16px",color:C.text,fontSize:15,fontWeight:500,outline:"none"}}/></div>);
const Btn=({children,onClick,bg,color,outline,disabled,style})=>(<button onClick={onClick} disabled={disabled} style={{width:"100%",padding:"14px 20px",borderRadius:13,fontSize:15,fontWeight:800,cursor:disabled?"not-allowed":"pointer",border:outline?"1.5px solid "+C.border:"none",background:disabled?C.bg3:outline?"transparent":(bg||C.blue),color:disabled?C.dim:color||(outline?C.muted:"#fff"),opacity:disabled?0.6:1,fontFamily:"inherit",...style}}>{children}</button>);
const SecLabel=({children})=><div style={{fontSize:9,fontWeight:800,letterSpacing:2,textTransform:"uppercase",color:C.dim,margin:"14px 0 8px 2px"}}>{children}</div>;
const Badge=({children,color})=><span style={{fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:7,background:(color||C.blue)+"18",color:color||C.blue,display:"inline-block"}}>{children}</span>;
const Empty=({icon,text})=><div style={{textAlign:"center",padding:"48px 20px",color:C.dim}}><div style={{fontSize:48,marginBottom:12,opacity:0.5}}>{icon}</div><div style={{fontSize:14,lineHeight:1.6,fontWeight:500}}>{text}</div></div>;
const Hdr=({title,sub,onBack,onAdd,children})=>(<div style={{padding:"14px 16px 12px",background:"rgba(9,9,15,.97)",borderBottom:"1px solid "+C.border,position:"sticky",top:0,zIndex:50,display:"flex",alignItems:"center",gap:10}}>{onBack&&<button onClick={onBack} style={{width:38,height:38,borderRadius:11,background:C.bg2,border:"1px solid "+C.border,color:C.muted,fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>←</button>}<div style={{flex:1}}><div style={{fontSize:9,fontWeight:800,letterSpacing:2.5,textTransform:"uppercase",color:C.dim}}>{sub||"KASSACONTROL"}</div><div style={{fontSize:20,fontWeight:900,letterSpacing:-0.5}}>{title}</div></div>{onAdd&&<button onClick={onAdd} style={{width:40,height:40,borderRadius:12,background:C.blue,border:"none",color:"#fff",fontSize:28,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>+</button>}{children}</div>);
const Toast=({msg,color})=>msg?<div style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",background:C.bg2,border:"1.5px solid "+(color||C.green),borderRadius:14,padding:"12px 22px",fontSize:14,fontWeight:700,color:C.text,zIndex:999,whiteSpace:"nowrap",pointerEvents:"none"}}>{msg}</div>:null;
const DelConfirm=({text,onConfirm,onCancel})=>(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,.75)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}><div style={{background:C.bg2,border:"1px solid #f04f5a50",borderRadius:20,padding:24,width:"100%",maxWidth:380}}><div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Удалить?</div><div style={{fontSize:13,color:C.dim,marginBottom:20}}>{text}</div><div style={{display:"flex",gap:10}}><Btn outline onClick={onCancel} style={{flex:1,padding:"12px 0"}}>Отмена</Btn><Btn bg={C.red} onClick={onConfirm} style={{flex:1,padding:"12px 0"}}>Удалить</Btn></div></div></div>);


function calcFifo(items,products){
  const byB={};
  items.filter(i=>i.expiry_date&&i.barcode&&(+i.quantity||0)>0).forEach(i=>{if(!byB[i.barcode])byB[i.barcode]=[];byB[i.barcode].push({...i});});
  const result=[];
  Object.entries(byB).forEach(([bc,batches])=>{
    const prod=products.find(p=>p.barcode===bc);
    const stock=prod?(prod.stock||0):null;
    const dels=dbGet("deliveries");
    const sorted=[...batches].sort((a,b)=>{const da=dels.find(d=>d.id===a.delivery_id);const db2=dels.find(d=>d.id===b.delivery_id);return((da&&da.date)||"").localeCompare((db2&&db2.date)||"");});
    if(stock===null){sorted.forEach(b=>result.push({...b,remaining:b.quantity}));return;}
    let left=Math.max(0,sorted.reduce((s,b)=>s+b.quantity,0)-stock);
    sorted.forEach(batch=>{let rem=batch.quantity;if(left>0){const d=Math.min(left,batch.quantity);rem=batch.quantity-d;left-=d;}result.push({...batch,remaining:rem,originalQty:batch.quantity});});
  });
  items.filter(i=>i.expiry_date&&!i.barcode&&(+i.quantity||0)>0).forEach(i=>result.push({...i,remaining:i.quantity}));
  return result;
}

function Home({tick}){
  const [period,setPeriod]=useState("day");
  const t=tod(),ws=weekStart(),ms=monStr();
  const fD=d=>period==="day"?d===t:period==="week"?d>=ws:period==="month"?d.startsWith(ms):true;
  const rev=dbGet("revenue"),exp=dbGet("expenses"),cash=dbGet("cash_movements");
  const diItems=dbGet("delivery_items"),products=dbGet("products");
  const totalRev=rev.filter(r=>fD(r.date)).reduce((s,r)=>s+(+r.amount||0),0);
  const totalGbs=rev.filter(r=>fD(r.date)).reduce((s,r)=>s+(+r.profit||0),0);
  const totalExp=exp.filter(e=>fD(e.date)).reduce((s,e)=>s+(+e.amount||0),0);
  const cleanP=totalGbs-totalExp;
  let cashBal=0;cash.forEach(m=>{if(m.type==="add"||m.type==="revenue")cashBal+=(+m.amount||0);else cashBal-=(+m.amount||0);});
  const allExp=diItems.filter(i=>i.expiry_date&&(+i.quantity||0)>0);
  const fifo=calcFifo(allExp,products).filter(i=>i.remaining>0);
  const expired=fifo.filter(i=>dLeft(i.expiry_date)<0).length;
  const critical=fifo.filter(i=>{const d=dLeft(i.expiry_date);return d>=0&&d<=3;}).length;
  const dateLabel=new Date(Date.now()+OFF).toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
  return(
    <div>
      <div style={{padding:"16px 16px 12px",background:"rgba(9,9,15,.97)",borderBottom:"1px solid "+C.border,position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div><div style={{fontSize:9,fontWeight:800,letterSpacing:2,color:C.dim,textTransform:"uppercase",marginBottom:3}}>{dateLabel}</div><div style={{fontSize:22,fontWeight:900}}>🏪 KassaControl</div></div>
          {(expired+critical)>0&&<div style={{background:"#f04f5a18",border:"1px solid #f04f5a50",borderRadius:14,padding:"6px 14px",textAlign:"center"}}><div style={{fontSize:9,color:C.red,fontWeight:800}}>ВНИМАНИЕ</div><div style={{fontSize:18,fontWeight:900,color:C.red}}>☠ {expired+critical}</div></div>}
        </div>
        <div style={{display:"flex",gap:6}}>
          {[["day","День"],["week","Неделя"],["month","Месяц"],["all","Всё"]].map(([id,l])=>(
            <button key={id} onClick={()=>setPeriod(id)} style={{flex:1,padding:"8px 4px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:800,border:"1.5px solid "+(period===id?C.blue+"60":C.border),background:period===id?C.blue+"18":C.bg2,color:period===id?C.blue:C.dim}}>{l}</button>
          ))}
        </div>
      </div>
      <div style={{padding:14,paddingBottom:30}}>
        <div style={{background:"linear-gradient(135deg,"+(cleanP>=0?"#0d2d1a":"#2d0d12")+","+C.bg2+")",border:"1.5px solid "+(cleanP>=0?C.green+"50":C.red+"50"),borderRadius:20,padding:20,marginBottom:12,textAlign:"center"}}>
          <div style={{fontSize:9,fontWeight:800,letterSpacing:2.5,color:C.dim,marginBottom:8}}>ЧИСТАЯ ПРИБЫЛЬ</div>
          <div style={{fontSize:44,fontWeight:900,color:cleanP>=0?C.green:C.red,letterSpacing:-2}}>{cleanP>=0?"+":""}{fmt(cleanP)} SM</div>
          <div style={{fontSize:12,color:C.dim,marginTop:6}}>GBS {fmt(totalGbs)} SM − Расходы {fmt(totalExp)} SM</div>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <div style={{flex:1,background:C.bg2,border:"1px solid "+C.green+"30",borderRadius:16,padding:"14px 12px"}}><div style={{fontSize:9,fontWeight:800,color:C.dim,marginBottom:6}}>ВЫРУЧКА</div><div style={{fontSize:20,fontWeight:900,color:C.green}}>{fmt(totalRev)} SM</div></div>
          <div style={{flex:1,background:C.bg2,border:"1px solid "+C.red+"30",borderRadius:16,padding:"14px 12px"}}><div style={{fontSize:9,fontWeight:800,color:C.dim,marginBottom:6}}>РАСХОДЫ</div><div style={{fontSize:20,fontWeight:900,color:C.red}}>−{fmt(totalExp)} SM</div></div>
        </div>
        <div style={{background:C.bg2,border:"1.5px solid "+(cashBal>=0?C.blue+"40":C.red+"40"),borderRadius:16,padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div><div style={{fontSize:9,fontWeight:800,color:C.dim,marginBottom:4}}>🏧 НАЛИЧНЫЕ В КАССЕ</div><div style={{fontSize:28,fontWeight:900,color:cashBal>=0?C.blue:C.red}}>{fmt(Math.abs(cashBal))} SM</div></div>
          <div style={{fontSize:40,opacity:0.35}}>🏧</div>
        </div>
      </div>
    </div>
  );
}


function Suppliers({tick,toast}){
  const [sc,setSc]=useState("list");const [curS,setCurS]=useState(null);const [curDel,setCurDel]=useState(null);const [curDelNum,setCurDelNum]=useState(null);
  if(sc==="add")return <AddSupplier onBack={()=>setSc("list")} onSaved={n=>{toast("✓ "+n+" добавлен");setSc("list");}}/>;
  if(sc==="supplier"&&curS)return <SupplierPage supplier={curS} onBack={()=>setSc("list")} onPosting={()=>setSc("posting")} onDeleted={()=>{toast("Удалён");setSc("list");}} onViewDel={(d,n)=>{setCurDel(d);setCurDelNum(n);setSc("delivery");}}/>;
  if(sc==="posting"&&curS)return <Posting supplier={curS} onBack={()=>setSc("supplier")} onSaved={n=>{toast("✓ Поставка сохранена");setSc("supplier");}}/>;
  if(sc==="delivery"&&curDel)return <DeliveryDetail delivery={curDel} num={curDelNum} onBack={()=>setSc("supplier")} onDeleted={()=>{toast("Партия удалена");setSc("supplier");}}/>;
  const suppliers=dbGet("suppliers");const deliveries=dbGet("deliveries");
  const cntMap={};deliveries.forEach(d=>{cntMap[d.supplier_id]=(cntMap[d.supplier_id]||0)+1;});
  return(
    <div>
      <Hdr title="Поставщики" onAdd={()=>setSc("add")}/>
      <div style={{padding:14,paddingBottom:30}}>
        {!suppliers.length?<Empty icon="🚚" text="Нажми + чтобы добавить поставщика"/>:
        suppliers.map(s=>(
          <div key={s.id} onClick={()=>{setCurS(s);setSc("supplier");}} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",background:C.bg2,border:"1px solid "+C.border,borderRadius:16,marginBottom:8,cursor:"pointer"}}>
            <div style={{width:46,height:46,borderRadius:13,background:"linear-gradient(135deg,#4466ff,#8844ff)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,fontWeight:900,color:"#fff",flexShrink:0}}>{inits(s.name)}</div>
            <div style={{flex:1}}><div style={{fontSize:15,fontWeight:700,marginBottom:2}}>{s.name}</div><div style={{fontSize:12,color:C.dim}}>{s.phone||"Нет номера"}</div></div>
            {cntMap[s.id]>0&&<Badge color={C.blue}>{cntMap[s.id]} пост.</Badge>}
            <div style={{color:C.dim,fontSize:20}}>›</div>
          </div>
        ))}
      </div>
    </div>
  );
}
function AddSupplier({onBack,onSaved}){
  const [name,setName]=useState("");const [phone,setPhone]=useState("");
  const save=async()=>{if(!name.trim())return;await dbInsert("suppliers",{name:name.trim(),phone:phone.trim()});onSaved(name.trim());};
  return(<div><Hdr title="Новый поставщик" sub="ПОСТАВКИ" onBack={onBack}/><div style={{padding:14}}><Card><TI label="ИМЯ" placeholder="Имя поставщика" value={name} onChange={setName} autoFocus/><TI label="ТЕЛЕФОН" type="tel" placeholder="+992 XX XXX XXXX" value={phone} onChange={setPhone}/><Btn bg={C.green} color="#051a0e" onClick={save} disabled={!name.trim()}>Сохранить</Btn></Card></div></div>);
}
function SupplierPage({supplier,onBack,onPosting,onDeleted,onViewDel}){
  const [confirmDel,setConfirmDel]=useState(false);
  const deliveries=dbGet("deliveries").filter(d=>d.supplier_id===supplier.id).sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const diItems=dbGet("delivery_items");
  const doDelete=async()=>{await sbDel("suppliers",supplier.id);DB.suppliers=DB.suppliers.filter(s=>s.id!==supplier.id);pub();onDeleted();};
  return(
    <div>
      <Hdr title={supplier.name} sub="ПОСТАВЩИК" onBack={onBack} onAdd={onPosting}/>
      <div style={{padding:14,paddingBottom:30}}>
        <button onClick={onPosting} style={{width:"100%",padding:15,borderRadius:14,background:"linear-gradient(135deg,#4466ff,#6644ff)",border:"none",color:"#fff",fontSize:16,fontWeight:900,cursor:"pointer",marginBottom:14,fontFamily:"inherit"}}>📦 Поступление товара</button>
        {confirmDel&&<DelConfirm text={"Удалить «"+supplier.name+"»?"} onConfirm={doDelete} onCancel={()=>setConfirmDel(false)}/>}
        <Btn outline onClick={()=>setConfirmDel(true)} style={{color:C.red,borderColor:C.red+"40",marginBottom:14}}>🗑 Удалить поставщика</Btn>
        {!deliveries.length?<Empty icon="📋" text="Поставок пока нет"/>:deliveries.map((d,idx)=>{
          const items=diItems.filter(i=>i.delivery_id===d.id);
          const expI=items.filter(i=>i.expiry_date&&dLeft(i.expiry_date)<0).length;
          const num=deliveries.length-idx;
          return(
            <div key={d.id} onClick={()=>onViewDel(d,num)} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",background:C.bg2,border:"1px solid "+(expI>0?C.red+"40":C.border),borderRadius:16,marginBottom:8,cursor:"pointer"}}>
              <div style={{background:C.bg3,borderRadius:12,padding:"8px 12px",textAlign:"center",flexShrink:0}}><div style={{fontSize:9,fontWeight:800,color:C.dim}}>ПАРТИЯ</div><div style={{fontSize:20,fontWeight:900}}>{"№"+num}</div></div>
              <div style={{flex:1}}><div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{fmtD(d.date)}</div><Badge color={C.blue}>{items.length} товаров</Badge>{expI>0&&<Badge color={C.red} style={{marginLeft:6}}>☠ {expI}</Badge>}</div>
              <div style={{color:C.dim,fontSize:22}}>›</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
function DeliveryDetail({delivery,num,onBack,onDeleted}){

        </Card>
        {ptxs.length>0&&<SecLabel>История · {ptxs.length} записей</SecLabel>}
        {ptxs.map(t=>{const ig=t.amount<0;const tc=ig?C.red:C.green;return(<div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",background:C.bg2,border:"1px solid "+tc+"20",borderRadius:14,marginBottom:8}}><div style={{flex:1}}><div style={{fontSize:15,fontWeight:800,color:tc}}>{(ig?"-":"+")+fmt(Math.abs(t.amount))} SM</div>{t.note&&<div style={{fontSize:12,color:C.muted}}>{t.note}</div>}<div style={{fontSize:11,color:C.dim}}>{fmtDT(t.created_at)}</div></div><button onClick={()=>setDelTx(t.id)} style={{background:"none",border:"none",color:C.dim,fontSize:20,cursor:"pointer"}}>🗑</button></div>);})}
        {!ptxs.length&&<Empty icon="📋" text="Операций пока нет"/>}
      </div>
    </div>
  );
}

function App(){
  const [tab,setTab]=useState("home");
  const [tick,setTick]=useState(0);
  const [toastMsg,setToastMsg]=useState(null);
  const [loading,setLoading]=useState(true);
  useEffect(()=>{const unsub=sub(()=>setTick(t=>t+1));initDB().then(()=>setLoading(false));return unsub;},[]);
  const showToast=(msg,color)=>{setToastMsg({msg,color});setTimeout(()=>setToastMsg(null),2500);};
  const diItems=dbGet("delivery_items");const products2=dbGet("products");
  const allExp2=diItems.filter(i=>i.expiry_date&&(+i.quantity||0)>0);
  const fifo2=calcFifo(allExp2,products2);
  const alertCount=fifo2.filter(i=>i.remaining>0&&dLeft(i.expiry_date)<0).length+fifo2.filter(i=>i.remaining>0&&dLeft(i.expiry_date)>=0&&dLeft(i.expiry_date)<=3).length;
  const debtTxs=dbGet("debt_transactions");const debtPpl=dbGet("debt_people");
  const debtAlert=debtPpl.filter(p=>{const b=debtTxs.filter(t=>t.person_id===p.id).reduce((s,t)=>s+(+t.amount||0),0);return b!==0;}).length;
  const NAV=[{id:"home",icon:"🏠",label:"Главная"},{id:"supply",icon:"🚚",label:"Поставки"},{id:"expiry",icon:"☠️",label:"Сроки"},{id:"revision",icon:"📦",label:"Ревизия"},{id:"finance",icon:"💰",label:"Финансы"},{id:"debts",icon:"🤝",label:"Долги"}];
  if(loading)return(<div style={{height:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:C.bg,color:C.text}}><div style={{fontSize:48,marginBottom:20}}>🏪</div><div style={{fontSize:18,fontWeight:800,marginBottom:8}}>KassaControl</div><div style={{fontSize:13,color:C.dim}}>Загрузка...</div></div>);
  return(
    <div style={{background:C.bg,color:C.text,minHeight:"100vh",fontFamily:"system-ui,-apple-system,sans-serif",maxWidth:430,margin:"0 auto",paddingBottom:80}}>
      <Toast msg={toastMsg?toastMsg.msg:null} color={toastMsg?toastMsg.color:null}/>
      {tab==="home"&&<Home tick={tick}/>}
      {tab==="supply"&&<Suppliers tick={tick} toast={showToast}/>}
      {tab==="expiry"&&<Expiry tick={tick}/>}
      {tab==="revision"&&<Revision tick={tick} toast={showToast}/>}
      {tab==="finance"&&<Finance tick={tick} toast={showToast}/>}
      {tab==="debts"&&<Debts tick={tick} toast={showToast}/>}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"rgba(9,9,15,.97)",borderTop:"1px solid "+C.border,display:"flex",zIndex:100}}>
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>setTab(n.id)} style={{flex:1,padding:"10px 0 11px",background:"none",border:"none",borderTop:"2px solid "+(tab===n.id?C.blue:"transparent"),cursor:"pointer",color:tab===n.id?C.blue:C.dim,display:"flex",flexDirection:"column",alignItems:"center",gap:2,fontFamily:"inherit",position:"relative"}}>
            <span style={{fontSize:19}}>{n.icon}</span>
            <span style={{fontSize:8,fontWeight:800,textTransform:"uppercase"}}>{n.label}</span>
            {n.id==="expiry"&&alertCount>0&&<span style={{position:"absolute",top:4,right:"50%",transform:"translateX(8px)",background:C.red,borderRadius:10,minWidth:16,height:16,fontSize:10,fontWeight:900,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px"}}>{alertCount}</span>}
            {n.id==="debts"&&debtAlert>0&&<span style={{position:"absolute",top:4,right:"50%",transform:"translateX(8px)",background:C.orange,borderRadius:10,minWidth:16,height:16,fontSize:10,fontWeight:900,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px"}}>{debtAlert}</span>}
          </button>
        ))}
      </div>
    </div>
  );
}


const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App,null));

</script>
</body>
</html>
