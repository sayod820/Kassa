function calcFifo(items, products) {
  var byB = {};
  items.filter(function(i) { return i.expiry_date && i.barcode && (+i.quantity || 0) > 0; }).forEach(function(i) {

  var result = [];
  Object.entries(byB).forEach(function(entry) {
    var bc = entry[0], batches = entry[1];
    var prod = products.find(function(p) { return p.barcode === bc; });
    var stock = prod ? prod.stock || 0 : null;
    var dels = dbGet("deliveries");
    var sorted = batches.slice().sort(function(a, b) {
      var da = dels.find(function(d) { return d.id === a.delivery_id; });
      var db2 = dels.find(function(d) { return d.id === b.delivery_id; });
      return (da && da.date || "").localeCompare(db2 && db2.date || "");
    });
    if (stock === null) {
      sorted.forEach(function(b) { result.push({ quantity: b.quantity, remaining: b.quantity, expiry_date: b.expiry_date, product_name: b.product_name, unit: b.unit, id: b.id }); });
      return;
    }
    var left = Math.max(0, sorted.reduce(function(s, b) { return s + b.quantity; }, 0) - stock);
    sorted.forEach(function(batch) {
      var rem = batch.quantity;
      if (left > 0) {
        var d = Math.min(left, batch.quantity);
        rem = batch.quantity - d;
        left -= d;
      }
      result.push({ quantity: batch.quantity, remaining: rem, expiry_date: batch.expiry_date, product_name: batch.product_name, unit: batch.unit, id: batch.id });
    });
  });
  items.filter(function(i) { return i.expiry_date && !i.barcode && (+i.quantity || 0) > 0; }).forEach(function(i) {
    result.push({ quantity: i.quantity, remaining: i.quantity, expiry_date: i.expiry_date, product_name: i.product_name, unit: i.unit, id: i.id });
  });
  return result;
}
