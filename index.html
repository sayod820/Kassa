const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'};
const sbGet=(t,q='')=>fetch(`${SB}/${t}?${q}`,{headers:H}).then(r=>r.json());
const sbPost=(t,b)=>fetch(`${SB}/${t}`,{method:'POST',headers:H,body:JSON.stringify(b)}).then(r=>r.json());
const sbPatch=(t,id,b)=>fetch(`${SB}/${t}?id=eq.${id}`,{method:'PATCH',headers:H,body:JSON.stringify(b)});
const sbDel=(t,id)=>fetch(`${SB}/${t}?id=eq.${id}`,{method:'DELETE',headers:H});

const DB={suppliers:[],deliveries:[],delivery_items:[],products:[],revisions:[],revision_items:[],expenses:[],revenue:[],cash_movements:[]};
let _subs=[];
const pub=()=>_subs.forEach(f=>f());
const sub=f=>{_subs.push(f);return()=>{_subs=_subs.filter(x=>x!==f);};};

async function fetchAllProducts(){
  const PAGE=1000;let all=[],p=0;
  while(true){
    const b=await sbGet('products',`select=*&order=name.asc&limit=${PAGE}&offset=${p*PAGE}`);
    if(!Array.isArray(b)||!b.length)break;
    all=[...all,...b];if(b.length<PAGE)break;p++;
  }
  return all;
}
async function initDB(){
  try{
    const [sup,del,di,prod,rev,ri,exp,rvn,cm]=await Promise.all([
      sbGet('suppliers','select=*&order=created_at.desc'),
      sbGet('deliveries','select=*&order=created_at.desc'),
      sbGet('delivery_items','select=*&order=created_at.desc'),
      fetchAllProducts(),
      sbGet('revisions','select=*&order=created_at.desc'),
      sbGet('revision_items','select=*'),
      sbGet('expenses','select=*&order=created_at.desc'),
      sbGet('revenue','select=*&order=created_at.desc'),
      sbGet('cash_movements','select=*&order=created_at.desc'),
    ]);
    DB.suppliers=Array.isArray(sup)?sup:[];
    DB.deliveries=Array.isArray(del)?del:[];
    DB.delivery_items=Array.isArray(di)?di:[];
    DB.products=Array.isArray(prod)?prod:[];
    DB.revisions=Array.isArray(rev)?rev:[];
    DB.revision_items=Array.isArray(ri)?ri:[];
    DB.expenses=Array.isArray(exp)?exp:[];
    DB.revenue=Array.isArray(rvn)?rvn:[];
    DB.cash_movements=Array.isArray(cm)?cm:[];
  }catch(e){console.error(e);}
}
function dbGet(k){return DB[k]||[];}
async function dbInsert(t,row){
  const res=await sbPost(t,row);
  const ins=Array.isArray(res)?res[0]:res;
  DB[t]=[ins,...DB[t]];pub();return ins;
}
async function dbInsertMany(t,rows){
  if(!rows.length)return;
  const res=await sbPost(t,rows);
  DB[t]=[...(Array.isArray(res)?res:[]),...DB[t]];pub();
}
async function dbDelete(t,id){
  await sbDel(t,id);DB[t]=DB[t].filter(r=>r.id!==id);pub();
}

const OFF=5*3600000;
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const tod=()=>{const d=new Date(Date.now()+OFF);return d.toISOString().slice(0,10);};
const monStr=()=>{const d=new Date(Date.now()+OFF);return d.toISOString().slice(0,7);};
const fmt=n=>(+n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD=d=>{if(!d)return'';return new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'});};
const fmtDs=d=>{if(!d)return{day:'?'};return{day:new Date(d+'T00:00:00').getDate()};};
const fmtT=s=>{
  if(!s)return'';
  try{
    let ts=String(s).replace(' ','T');
    if(!/[Z+]/.test(ts.slice(10)))ts+='Z';
    const d=new Date(new Date(ts).getTime()+OFF);
    return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
  }catch(e){return'';}
};
const dLeft=d=>{if(!d)return 999;return Math.ceil((new Date(d)-new Date(tod()))/86400000);};
const eColor=n=>n<0?'#f04f5a':n<=3?'#f09040':n<=7?'#e8c040':'#3ecf8e';
const eText=n=>n<0?'просрочен '+Math.abs(n)+'д':n===0?'сегодня!':n+' дн.';
const inits=n=>(n||'').trim().split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase()||'?';
const getMonths=n=>{const r=[],d=new Date();for(let i=0;i<n;i++){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0');r.push({val:`${y}-${m}`,label:d.toLocaleDateString('ru-RU',{month:'long',year:'2-digit'})});d.setMonth(d.getMonth()-1);}return r;};
const weekStart=()=>{const d=new Date(Date.now()+OFF),day=d.getDay()||7;d.setDate(d.getDate()-day+1);return d.toISOString().slice(0,10);};

function calcFifo(items,products){
  const by={};
  items.filter(i=>i.expiry_date&&i.barcode&&(+i.quantity||0)>0).forEach(i=>{if(!by[i.barcode])by[i.barcode]=[];by[i.barcode].push({...i});});
  const res=[];
  Object.entries(by).forEach(([bc,batches])=>{
    const prod=products.find(p=>p.barcode===bc);
    const stock=prod?(prod.stock||0):null;
    const sorted=[...batches].sort((a,b)=>{
      const da=dbGet('deliveries').find(d=>d.id===a.delivery_id);
      const db=dbGet('deliveries').find(d=>d.id===b.delivery_id);
      return(da?.date||'').localeCompare(db?.date||'');
    });
    if(stock===null){sorted.forEach(b=>res.push({...b,remaining:b.quantity}));return;}
    let sell=Math.max(0,sorted.reduce((s,b)=>s+b.quantity,0)-stock);
    sorted.forEach(b=>{let r=b.quantity;if(sell>0){const x=Math.min(sell,b.quantity);r=b.quantity-x;sell-=x;}res.push({...b,remaining:r,origQty:b.quantity});});
  });
  items.filter(i=>i.expiry_date&&!i.barcode&&(+i.quantity||0)>0).forEach(i=>res.push({...i,remaining:i.quantity}));
  return res;
}

function Home({tick}){
  const [period,setPeriod]=useState('day');
  const t=tod(),ws=weekStart(),ms=monStr();
  const fD=d=>period==='day'?d===t:period==='week'?d>=ws:period==='month'?d.startsWith(ms):true;
  const rev=dbGet('revenue'),exp=dbGet('expenses'),cash=dbGet('cash_movements');
  const di=dbGet('delivery_items'),revs=dbGet('revisions'),ri=dbGet('revision_items'),prods=dbGet('products');
  const tRev=rev.filter(r=>fD(r.date)).reduce((s,r)=>s+(+r.amount||0),0);
  const tGbs=rev.filter(r=>fD(r.date)).reduce((s,r)=>s+(+r.profit||0),0);
  const tExp=exp.filter(e=>fD(e.date)).reduce((s,e)=>s+(+e.amount||0),0);
  const clean=tGbs-tExp;
  let cashBal=0;cash.forEach(m=>{if(m.type==='add'||m.type==='revenue')cashBal+=(+m.amount||0);else cashBal-=(+m.amount||0);});
  const fifo=calcFifo(di.filter(i=>i.expiry_date&&(+i.quantity||0)>0),prods);
  const we=fifo.filter(i=>i.remaining>0);
  const expired=we.filter(i=>dLeft(i.expiry_date)<0);
  const crit=we.filter(i=>{const d=dLeft(i.expiry_date);return d>=0&&d<=3;});
  const soon=we.filter(i=>{const d=dLeft(i.expiry_date);return d>3&&d<=7;});
  const hasAlert=(expired.length+crit.length)>0;
  const lastRev=[...revs].sort((a,b)=>b.created_at.localeCompare(a.created_at))[0];
  const aRevs=revs.filter(r=>fD(r.date)).length>0?revs.filter(r=>fD(r.date)):[lastRev].filter(Boolean);
  const lrI=ri.filter(i=>aRevs.some(r=>r.id===i.revision_id));
  const lrC=lrI.filter(i=>i.actual!==null);
  const lrS=lrC.filter(i=>i.actual<i.expected);
  const lrL=lrC.reduce((s,i)=>s+i.expected*(i.price||0),0)-lrC.reduce((s,i)=>s+i.actual*(i.price||0),0);
  const dl=new Date(Date.now()+OFF).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  return(
    <div>
      <div style={{padding:'16px 16px 12px',background:'rgba(9,9,15,.97)',backdropFilter:'blur(20px)',borderBottom:'1px solid '+C.border,position:'sticky',top:0,zIndex:50}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <div><div style={{fontSize:9,fontWeight:800,letterSpacing:2,color:C.dim,textTransform:'uppercase',marginBottom:3}}>{dl}</div><div style={{fontSize:22,fontWeight:900}}>🏪 KassaControl</div></div>
          {hasAlert&&<div style={{background:'#f04f5a18',border:'1px solid #f04f5a50',borderRadius:14,padding:'6px 14px',textAlign:'center'}}><div style={{fontSize:9,color:C.red,fontWeight:800}}>ВНИМАНИЕ</div><div style={{fontSize:18,fontWeight:900,color:C.red}}>☠ {expired.length+crit.length}</div></div>}
        </div>
        <div style={{display:'flex',gap:6}}>
          {[['day','День'],['week','Неделя'],['month','Месяц'],['all','Всё']].map(([id,l])=>(
            <button key={id} onClick={()=>setPeriod(id)} style={{flex:1,padding:'8px 4px',borderRadius:10,cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:800,border:'1.5px solid '+(period===id?C.blue+'60':C.border),background:period===id?C.blue+'18':C.bg2,color:period===id?C.blue:C.dim}}>{l}</button>
          ))}
        </div>
      </div>
      <div style={{padding:14,paddingBottom:30}}>
        <div style={{background:'linear-gradient(135deg,'+(clean>=0?'#0d2d1a':'#2d0d12')+','+C.bg2+')',border:'1.5px solid '+(clean>=0?C.green+'50':C.red+'50'),borderRadius:20,padding:20,marginBottom:12,textAlign:'center'}}>
          <div style={{fontSize:9,fontWeight:800,letterSpacing:2.5,color:C.dim,marginBottom:8}}>ЧИСТАЯ ПРИБЫЛЬ</div>
          <div style={{fontSize:48,fontWeight:900,color:clean>=0?C.green:C.red,letterSpacing:-2,lineHeight:1}}>{clean>=0?'+':''}{fmt(clean)}</div>
          <div style={{fontSize:11,color:C.dim,marginTop:5}}>GBS {fmt(tGbs)} - Расходы {fmt(tExp)} SM</div>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <div style={{flex:1,background:C.bg2,border:'1px solid '+C.green+'30',borderRadius:16,padding:'14px 12px'}}><div style={{fontSize:9,fontWeight:800,color:C.dim,marginBottom:6}}>ВЫРУЧКА</div><div style={{fontSize:20,fontWeight:900,color:C.green}}>{fmt(tRev)} SM</div></div>
          <div style={{flex:1,background:C.bg2,border:'1px solid '+C.red+'30',borderRadius:16,padding:'14px 12px'}}><div style={{fontSize:9,fontWeight:800,color:C.dim,marginBottom:6}}>РАСХОДЫ</div><div style={{fontSize:20,fontWeight:900,color:C.red}}>-{fmt(tExp)} SM</div></div>
        </div>
        <div style={{background:C.bg2,border:'1.5px solid '+(cashBal>=0?C.blue+'40':C.red+'40'),borderRadius:16,padding:'14px 16px',marginBottom:12,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div><div style={{fontSize:9,fontWeight:800,letterSpacing:2,color:C.dim,marginBottom:4}}>🏧 НАЛИЧНЫЕ В КАССЕ</div><div style={{fontSize:28,fontWeight:900,color:cashBal>=0?C.blue:C.red}}>{fmt(Math.abs(cashBal))} SM</div></div>
          <div style={{fontSize:40,opacity:.35}}>🏧</div>
        </div>
        <div style={{background:C.bg2,border:'1px solid '+((expired.length+crit.length)>0?C.red+'40':C.border),borderRadius:16,overflow:'hidden',marginBottom:12}}>
          <div style={{padding:'10px 16px',background:C.bg3,borderBottom:'1px solid '+C.border,display:'flex',justifyContent:'space-between'}}>
            <div style={{fontSize:10,fontWeight:800,letterSpacing:2,color:C.dim}}>☠️ СРОКИ ГОДНОСТИ</div>
            {hasAlert&&<div style={{fontSize:11,fontWeight:800,color:C.red}}>Требует внимания!</div>}
          </div>
          <div style={{display:'flex'}}>
            {[['Просрочено',expired.length,C.red,'☠'],['Критично',crit.length,C.orange,'⚠'],['Скоро',soon.length,C.yellow,'!']].map(([l,n,c,ic])=>(
              <div key={l} style={{flex:1,padding:'13px 10px',textAlign:'center',borderRight:l!=='Скоро'?'1px solid '+C.border:'none'}}>

            <div key={item.id} style={{display:'flex',justifyContent:'space-between',padding:'8px 16px',borderTop:'1px solid '+C.red+'25'}}>

            </div>
          ))}
        </div>
        {aRevs.length>0&&(
          <div style={{background:C.bg2,border:'1px solid '+(lrS.length>0?C.red+'35':C.border),borderRadius:16,overflow:'hidden',marginBottom:12}}>
            <div style={{padding:'10px 16px',background:C.bg3,borderBottom:'1px solid '+C.border}}><div style={{fontSize:10,fontWeight:800,letterSpacing:2,color:C.dim}}>📦 РЕВИЗИЯ</div></div>
            <div style={{display:'flex'}}>
              {[['Позиций',lrI.length,C.blue],['Недостача',lrS.length,lrS.length>0?C.red:C.green],['Потери',lrL>0?('-'+fmt(lrL)+' SM'):'✓ 0',lrL>0?C.red:C.green]].map(([l,v,c])=>(
                <div key={l} style={{flex:1,padding:'13px 10px',textAlign:'center',borderRight:l!=='Потери'?'1px solid '+C.border:'none'}}>
                  <div style={{fontSize:9,fontWeight:800,color:C.dim,marginBottom:4}}>{l}</div>
                  <div style={{fontSize:l==='Потери'?14:22,fontWeight:900,color:c}}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        )}
        {(()=>{
          const events=[];
          rev.filter(r=>fD(r.date)).forEach(r=>events.push({id:'r'+r.id,time:r.created_at,icon:'💰',color:C.green,title:'+'+fmt(r.amount)+' SM',sub:'Выручка'+(r.profit?' GBS:'+fmt(r.profit)+' SM':''),date:r.date}));

          cash.filter(m=>fD(m.date)&&(m.type==='add'||m.type==='remove')).forEach(m=>events.push({id:'c'+m.id,time:m.created_at,icon:m.type==='add'?'➕':'➖',color:m.type==='add'?C.blue:C.orange,title:(m.type==='add'?'+':'-')+fmt(m.amount)+' SM',sub:(m.type==='add'?'Внесено':'Снято')+(m.description?' · '+m.description:''),date:m.date}));
          events.sort((a,b)=>b.time.localeCompare(a.time));
          if(!events.length)return null;
          return(
            <div style={{background:C.bg2,border:'1px solid '+C.border,borderRadius:16,overflow:'hidden'}}>
              <div style={{padding:'10px 16px',background:C.bg3,borderBottom:'1px solid '+C.border}}><div style={{fontSize:10,fontWeight:800,letterSpacing:2,color:C.dim}}>📋 ИСТОРИЯ · {events.length}</div></div>
              {events.map((ev,i)=>(
                <div key={ev.id} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 16px',borderBottom:i<events.length-1?'1px solid '+C.border:'none'}}>

  const [cm,setCm]=useState(monStr());const [amt,setAmt]=useState('');const [rsn,setRsn]=useState('');const [di,setDi]=useState(null);
  const months=getMonths(4);
  const me=dbGet('expenses').filter(e=>e.month_year===cm).sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const total=me.reduce((s,e)=>s+(+e.amount||0),0);
  return(<div style={{padding:14,paddingBottom:30}}>
    {di&&<DC text={'Расход «'+di.reason+'» удалится, '+fmt(di.amount)+' SM вернётся в кассу'} onOk={async()=>{await dbDelete('expenses',di.id);await dbInsert('cash_movements',{type:'add',amount:+di.amount,description:'Возврат расхода: '+di.reason,date:tod()});setDi(null);}} onNo={()=>setDi(null)}/>}
    <div style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:4,marginBottom:12}}>{months.map(m=><button key={m.val} onClick={()=>setCm(m.val)} style={{padding:'7px 14px',borderRadius:20,cursor:'pointer',fontFamily:'inherit',fontSize:11,fontWeight:700,whiteSpace:'nowrap',flexShrink:0,border:'1.5px solid '+(cm===m.val?C.red+'70':C.border),background:cm===m.val?C.red+'18':C.bg2,color:cm===m.val?C.red:C.dim}}>{m.label}</button>)}</div>
    <div style={{background:C.bg2,border:'1px solid '+C.border,borderRadius:16,overflow:'hidden',marginBottom:14}}><div style={{padding:'16px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}><div><div style={{fontSize:36,fontWeight:900,color:C.red}}>{fmt(total)} SM</div><div style={{fontSize:12,color:C.dim,marginTop:4}}>{me.length} записей</div></div><div style={{fontSize:44,opacity:.35}}>💸</div></div></div>
    <Card><TI label="СУММА (SM)" type="number" placeholder="0.00" value={amt} onChange={setAmt} autoFocus/><TI label="ПРИЧИНА" placeholder="Аренда, зарплата..." value={rsn} onChange={setRsn}/><Btn bg={C.red} onClick={async()=>{if(!amt||!rsn.trim())return;await dbInsert('expenses',{amount:+amt,reason:rsn.trim(),month_year:monStr(),date:tod()});await dbInsert('cash_movements',{type:'expense',amount:+amt,description:rsn.trim(),date:tod()});setAmt('');setRsn('');}} disabled={!amt||!rsn.trim()}>- Записать расход</Btn></Card>
    {!me.length?<Empty icon="💸" text="Расходов нет"/>:me.map(e=>(<div key={e.id} style={{display:'flex',alignItems:'center',gap:12,padding:'13px 16px',background:C.bg2,border:'1px solid '+C.border,borderRadius:14,marginBottom:8}}>
      <div style={{width:44,height:44,borderRadius:12,background:'#f04f5a18',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>💸</div>
      <div style={{flex:1,minWidth:0}}><div style={{fontSize:16,fontWeight:800,color:C.red,marginBottom:3}}>-{fmt(e.amount)} SM</div><div style={{fontSize:13,color:C.muted,marginBottom:2}}>{e.reason}</div><div style={{fontSize:11,color:C.dim}}>{fmtD(e.date)} · {fmtT(e.created_at)}</div></div>
      <button onClick={()=>setDi(e)} style={{background:'none',border:'none',color:C.dim,fontSize:20,cursor:'pointer',padding:4}}>🗑</button>
    </div>))}
  </div>);
}
function RevTab({tick}){
  const [amt,setAmt]=useState('');const [gbs,setGbs]=useState('');const [date,setDate]=useState(tod());const [di,setDi]=useState(null);
  const all=dbGet('revenue').sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const tR=all.reduce((s,r)=>s+(+r.amount||0),0);const tP=all.reduce((s,r)=>s+(+r.profit||0),0);
  const today=all.filter(r=>r.date===tod()).reduce((s,r)=>s+(+r.amount||0),0);
  return(<div style={{padding:14,paddingBottom:30}}>
    {di&&<DC text={'Выручка '+fmt(di.amount)+' SM удалится, касса уменьшится'} onOk={async()=>{await dbDelete('revenue',di.id);await dbInsert('cash_movements',{type:'remove',amount:+di.amount,description:'Удаление выручки',date:tod()});setDi(null);}} onNo={()=>setDi(null)}/>}
    <div style={{background:C.bg2,border:'1px solid '+C.border,borderRadius:16,overflow:'hidden',marginBottom:14}}><div style={{padding:'16px 20px',borderBottom:'1px solid '+C.border}}><div style={{fontSize:10,color:C.dim,marginBottom:4}}>СЕГОДНЯ</div><div style={{fontSize:32,fontWeight:900,color:C.green}}>{fmt(today)} SM</div></div><div style={{display:'flex'}}><div style={{flex:1,padding:'14px',borderRight:'1px solid '+C.border}}><div style={{fontSize:9,color:C.dim,marginBottom:4}}>ВСЕГО</div><div style={{fontSize:18,fontWeight:900,color:C.green}}>{fmt(tR)} SM</div></div><div style={{flex:1,padding:'14px'}}><div style={{fontSize:9,color:C.dim,marginBottom:4}}>ПРИБЫЛЬ GBS</div><div style={{fontSize:18,fontWeight:900,color:C.blue}}>{fmt(tP)} SM</div></div></div></div>
    <Card><TI label="ВЫРУЧКА (SM)" type="number" placeholder="0.00" value={amt} onChange={setAmt} autoFocus/><TI label="ПРИБЫЛЬ GBS (необязательно)" type="number" placeholder="из GBS.Market" value={gbs} onChange={setGbs}/><div style={{marginBottom:12}}><FL>ДАТА</FL><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{width:'100%',background:C.bg,border:'1px solid '+C.border,borderRadius:12,padding:'13px 16px',color:C.text,fontSize:15,outline:'none'}}/></div><Btn bg={C.green} color="#051a0e" onClick={async()=>{if(!amt)return;await dbInsert('revenue',{amount:+amt,profit:gbs?+gbs:null,date,source:'manual'});await dbInsert('cash_movements',{type:'revenue',amount:+amt,description:'Выручка',date});setAmt('');setGbs('');}} disabled={!amt}>+ Добавить выручку</Btn></Card>
    {!all.length?<Empty icon="💰" text="Нет записей"/>:all.map(r=>(<div key={r.id} style={{display:'flex',alignItems:'center',gap:12,padding:'13px 16px',background:C.bg2,border:'1px solid '+C.border,borderRadius:14,marginBottom:8}}>
      <div style={{width:44,height:44,borderRadius:12,background:'#3ecf8e18',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>💰</div>
      <div style={{flex:1,minWidth:0}}><div style={{fontSize:16,fontWeight:800,color:C.green,marginBottom:3}}>+{fmt(r.amount)} SM</div><div style={{fontSize:12,color:C.dim}}>GBS: <b style={{color:C.blue}}>{fmt(r.profit||0)} SM</b></div><div style={{fontSize:11,color:C.dim}}>{fmtD(r.date)} · {fmtT(r.created_at)}</div></div>
      <button onClick={()=>setDi(r)} style={{background:'none',border:'none',color:C.dim,fontSize:20,cursor:'pointer',padding:4}}>🗑</button>
    </div>))}
  </div>);
}
function CashTab({tick}){
  const [act,setAct]=useState('add');const [amt,setAmt]=useState('');const [dsc,setDsc]=useState('');const [di,setDi]=useState(null);
  const movs=dbGet('cash_movements').sort((a,b)=>b.created_at.localeCompare(a.created_at));
  let bal=0;movs.forEach(m=>{if(m.type==='add'||m.type==='revenue')bal+=(+m.amount||0);else bal-=(+m.amount||0);});
  const tm=movs.filter(m=>m.date===tod());
  const tIn=tm.filter(m=>m.type==='add'||m.type==='revenue').reduce((s,m)=>s+(+m.amount||0),0);
  const tOut=tm.filter(m=>m.type!=='add'&&m.type!=='revenue').reduce((s,m)=>s+(+m.amount||0),0);
  const TL={remove:'Снято',expense:'Расход',revenue:'Выручка',add:'Добавлено'};
  const TI2={remove:'➖',expense:'💸',revenue:'💰',add:'➕'};
  const TC={remove:C.red,expense:C.red,revenue:C.green,add:C.green};
  const isP=t=>t==='revenue'||t==='add';
  return(<div style={{padding:14,paddingBottom:30}}>
    {di&&<DC text="Запись движения кассы удалится" onOk={async()=>{await dbDelete('cash_movements',di);setDi(null);}} onNo={()=>setDi(null)}/>}
    <div style={{background:C.bg2,border:'1.5px solid '+(bal>=0?C.green+'40':C.red+'40'),borderRadius:18,padding:'22px 20px',marginBottom:10,textAlign:'center'}}>
      <div style={{fontSize:10,fontWeight:800,letterSpacing:2.5,color:C.dim,marginBottom:8}}>НАЛИЧНЫЕ В КАССЕ</div>
      <div style={{fontSize:46,fontWeight:900,color:bal>=0?C.green:C.red}}>{fmt(Math.abs(bal))} SM</div>
      {bal<0&&<div style={{fontSize:13,color:C.red,marginTop:8,fontWeight:700}}>⚠ Касса в минусе!</div>}
    </div>
    <div style={{display:'flex',gap:8,marginBottom:14}}>
      <div style={{flex:1,background:C.bg2,border:'1px solid '+C.border,borderRadius:14,padding:'12px 14px'}}><div style={{fontSize:9,color:C.dim,marginBottom:4}}>ПРИХОД СЕГОДНЯ</div><div style={{fontSize:18,fontWeight:900,color:C.green}}>+{fmt(tIn)} SM</div></div>
      <div style={{flex:1,background:C.bg2,border:'1px solid '+C.border,borderRadius:14,padding:'12px 14px'}}><div style={{fontSize:9,color:C.dim,marginBottom:4}}>РАСХОД СЕГОДНЯ</div><div style={{fontSize:18,fontWeight:900,color:C.red}}>-{fmt(tOut)} SM</div></div>
    </div>
    <Card>
      <div style={{display:'flex',gap:8,marginBottom:14}}>
        <button onClick={()=>setAct('add')} style={{flex:1,padding:'11px 8px',borderRadius:11,cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:800,border:'1.5px solid '+(act==='add'?C.green+'60':C.border),background:act==='add'?C.green+'18':C.bg2,color:act==='add'?C.green:C.dim}}>+ Добавить</button>
        <button onClick={()=>setAct('remove')} style={{flex:1,padding:'11px 8px',borderRadius:11,cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:800,border:'1.5px solid '+(act==='remove'?C.red+'60':C.border),background:act==='remove'?C.red+'18':C.bg2,color:act==='remove'?C.red:C.dim}}>- Снять</button>
      </div>
      <TI label="СУММА (SM)" type="number" placeholder="0.00" value={amt} onChange={setAmt} autoFocus/>
      <TI label="ОПИСАНИЕ" placeholder={act==='add'?'Откуда...':'Куда...'} value={dsc} onChange={setDsc}/>
      <Btn bg={act==='add'?C.green:C.red} color={act==='add'?'#051a0e':'#fff'} onClick={async()=>{if(!amt)return;await dbInsert('cash_movements',{type:act,amount:+amt,description:dsc.trim()||(act==='add'?'Внесено':'Снятие'),date:tod()});setAmt('');setDsc('');}} disabled={!amt}>{act==='add'?'+ Добавить в кассу':'- Снять из кассы'}</Btn>
    </Card>
    {!movs.length?<Empty icon="🏧" text="Движений нет"/>:movs.map(m=>(<div key={m.id} style={{display:'flex',alignItems:'center',gap:12,padding:'13px 16px',background:C.bg2,border:'1px solid '+C.border,borderRadius:14,marginBottom:8}}>
      <div style={{width:44,height:44,borderRadius:12,background:TC[m.type]+'15',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>{TI2[m.type]||'💵'}</div>
      <div style={{flex:1,minWidth:0}}><div style={{fontSize:16,fontWeight:800,color:TC[m.type]||C.muted,marginBottom:3}}>{isP(m.type)?'+':'-'}{fmt(m.amount)} SM</div><div style={{fontSize:12,color:C.muted}}>{TL[m.type]||m.type}{m.description?' · '+m.description:''}</div><div style={{fontSize:11,color:C.dim,marginTop:2}}>{fmtD(m.date)} · {fmtT(m.created_at)}</div></div>
      <button onClick={()=>setDi(m.id)} style={{background:'none',border:'none',color:C.dim,fontSize:20,cursor:'pointer',padding:4}}>🗑</button>
    </div>))}
  </div>);
}

function App(){
  const [ready,setReady]=useState(false);
  const [tab,setTab]=useState('home');
  const [tick,setTick]=useState(0);
  const [toast,setToast]=useState(null);
  const showToast=(msg,color)=>{setToast({msg,color});setTimeout(()=>setToast(null),3000);};
  useEffect(()=>{
    initDB().then(()=>setReady(true));
    return sub(()=>setTick(t=>t+1));
  },[]);
  if(!ready)return(
    <div style={{background:C.bg,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:14,fontFamily:'system-ui'}}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      <div style={{fontSize:56}}>🏪</div>
      <div style={{fontSize:20,fontWeight:900,color:'#eeeeff'}}>KassaControl</div>
      <div style={{width:28,height:28,border:'2px solid #1e1e38',borderTopColor:'#4466ff',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>
    </div>
  );
  const NAV=[{id:'home',icon:'🏠',label:'Главная'},{id:'supply',icon:'🚚',label:'Поставки'},{id:'expiry',icon:'☠️',label:'Сроки'},{id:'revision',icon:'📦',label:'Ревизия'},{id:'finance',icon:'💰',label:'Финансы'}];
  const di=dbGet('delivery_items');const prods=dbGet('products');
  const fifo=calcFifo(di.filter(i=>i.expiry_date&&(+i.quantity||0)>0),prods);
  const alert=fifo.filter(i=>i.remaining>0&&dLeft(i.expiry_date)<0).length+fifo.filter(i=>i.remaining>0&&dLeft(i.expiry_date)>=0&&dLeft(i.expiry_date)<=3).length;
  return(
    <div style={{background:C.bg,color:C.text,minHeight:'100vh',fontFamily:'system-ui,-apple-system,sans-serif',maxWidth:430,margin:'0 auto',paddingBottom:80}}>
      <style>{css}</style>
      <Toast msg={toast?.msg} color={toast?.color}/>
      {tab==='home'&&<Home tick={tick}/>}
      {tab==='supply'&&<Suppliers tick={tick} toast={showToast}/>}
      {tab==='expiry'&&<Expiry tick={tick}/>}
      {tab==='revision'&&<Revision tick={tick} toast={showToast}/>}
      {tab==='finance'&&<Finance tick={tick}/>}
      <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:430,background:'rgba(9,9,15,.97)',backdropFilter:'blur(20px)',borderTop:'1px solid '+C.border,display:'flex',zIndex:100,paddingBottom:'env(safe-area-inset-bottom,0)'}}>
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>setTab(n.id)} style={{flex:1,padding:'10px 0 13px',background:'none',border:'none',borderTop:'2px solid '+(tab===n.id?C.blue:'transparent'),cursor:'pointer',color:tab===n.id?C.blue:C.dim,display:'flex',flexDirection:'column',alignItems:'center',gap:2,fontFamily:'inherit',position:'relative'}}>
            <span style={{fontSize:21}}>{n.icon}</span>
            <span style={{fontSize:9,fontWeight:800,letterSpacing:.5,textTransform:'uppercase'}}>{n.label}</span>
            {n.id==='expiry'&&alert>0&&<span style={{position:'absolute',top:6,right:'50%',transform:'translateX(8px)',background:C.red,borderRadius:10,minWidth:16,height:16,fontSize:10,fontWeight:900,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',padding:'0 4px'}}>{alert}</span>}
          </button>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
