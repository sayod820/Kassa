<script type="text/babel">

const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxvemllb2xkcGtlenhvbnJ4d3J5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMzY0MjEsImV4cCI6MjA5MzYxMjQyMX0.sS5Z8i1xFdv6YiKrpL9Y2sTWEo6Yk3K9TqQhv4HNwts';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'};

async function sbGet(table,q=''){ const r=await fetch(`${SB}/${table}?${q}`,{headers:H}); return r.json(); }
async function sbPost(table,body){ const r=await fetch(`${SB}/${table}`,{method:'POST',headers:H,body:JSON.stringify(body)}); return r.json(); }
async function sbDel(table,id){ await fetch(`${SB}/${table}?id=eq.${id}`,{method:'DELETE',headers:H}); }

const DB={suppliers:[],deliveries:[],delivery_items:[],products:[],revisions:[],revision_items:[],expenses:[],revenue:[],cash_movements:[],debts:[]};
let _ready=false,_subs=[];
const pub=()=>_subs.forEach(fn=>fn());
const sub=fn=>{ _subs.push(fn); return ()=>{ _subs=_subs.filter(f=>f!==fn); }; };

async function fetchAllProducts(){
  const PAGE=1000; let all=[],page=0;
  while(true){
    const batch=await sbGet('products',`select=*&order=name.asc&limit=${PAGE}&offset=${page*PAGE}`);
    if(!Array.isArray(batch)||!batch.length) break;
    all=[...all,...batch];
    if(batch.length<PAGE) break;
    page++;
  }
  return all;
}



async function initDB(){
  try{
    const [sup,del,di,prod,rev,ri,exp,rvn,cm,dbt]=await Promise.all([
      sbGet('suppliers','select=*&order=created_at.desc'),
      sbGet('deliveries','select=*&order=created_at.desc'),
      sbGet('delivery_items','select=*&order=created_at.desc'),
      fetchAllProducts(),
      sbGet('revisions','select=*&order=created_at.desc'),
      sbGet('revision_items','select=*'),
      sbGet('expenses','select=*&order=created_at.desc'),
      sbGet('revenue','select=*&order=created_at.desc'),
      sbGet('cash_movements','select=*&order=created_at.desc'),
      sbGet('debts','select=*&order=created_at.desc'),
    ]);
    DB.suppliers=Array.isArray(sup)?sup:[];
    DB.deliveries=Array.isArray(del)?del:[];
    DB.delivery_items=Array.isArray(di)?di:[];
    DB.products=Array.isArray(prod)?prod:[];
    DB.revisions=Array.isArray(rev)?rev:[];
    DB.revision_items=Array.isArray(ri)?ri:[];
    DB.expenses=Array.isArray(exp)?exp:[];
    DB.revenue=Array.isArray(rvn)?rvn:[];
    DB.cash_movements=Array.isArray(cm)?cm:[];
    DB.debts=Array.isArray(dbt)?dbt:[];
  }catch(e){ console.error('initDB error:',e); }
  _ready=true; pub();
}

function dbGet(k){ return DB[k]||[]; }
async function dbInsert(table,row){
  const res=await sbPost(table,row);
  const inserted=Array.isArray(res)?res[0]:res;
  DB[table]=[inserted,...DB[table]];
  pub(); return inserted;
}
async function dbInsertMany(table,rows){
  if(!rows.length)return;
  const res=await sbPost(table,rows);
  const inserted=Array.isArray(res)?res:[];
  DB[table]=[...inserted,...DB[table]]; pub();
}
async function dbDelete(table,id){
  await sbDel(table,id);
  DB[table]=DB[table].filter(r=>r.id!==id); pub();
}

const TZ='Asia/Dushanbe';
const OFFSET=5*60*60*1000;
const uid=()=>'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16);});
const tod=()=>{ const d=new Date(Date.now()+OFFSET); return d.toISOString().slice(0,10); };
const monStr=()=>{ const d=new Date(Date.now()+OFFSET); return d.toISOString().slice(0,7); };
const fmt=n=>(+n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD=d=>{ if(!d)return''; return new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtDs=d=>{ if(!d)return{day:'?',mon:'?'}; const dt=new Date(d+'T00:00:00'); return{day:dt.getDate(),mon:dt.toLocaleDateString('ru-RU',{month:'short'}).replace('.','')}; };
const fmtT=s=>{
  if(!s)return'';
  try{
    let ts=String(s).replace(' ','T');
    if(!/[Z+]/.test(ts.slice(10))) ts+='Z';
    const ms=new Date(ts).getTime();
    if(isNaN(ms))return'';
    const d=new Date(ms+5*3600000);
    return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
  }catch(e){return'';}
};
const dLeft=d=>{ if(!d)return 999; return Math.ceil((new Date(d)-new Date(tod()))/86400000); };
const eColor=n=>n<0?'#f04f5a':n<=3?'#f09040':n<=7?'#e8c040':'#3ecf8e';
const eText=n=>n<0?`просрочен ${Math.abs(n)}д`:n===0?'сегодня!':n+' дн.';
const inits=n=>n.trim().split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase()||'?';
const getMonths=n=>{ const r=[],d=new Date(); for(let i=0;i<n;i++){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'); r.push({val:`${y}-${m}`,label:d.toLocaleDateString('ru-RU',{month:'long',year:'2-digit'})}); d.setMonth(d.getMonth()-1); } return r; };
const weekStart=()=>{ const d=new Date(Date.now()+OFFSET),day=d.getDay()||7; d.setDate(d.getDate()-day+1); return d.toISOString().slice(0,10); };

const Card=({children,style,ac})=><div style={{background:C.bg2,border:`1px solid ${ac||C.border}`,borderRadius:18,padding:16,marginBottom:10,...style}}>{children}</div>;
const FL=({children})=><div style={{fontSize:9,fontWeight:800,letterSpacing:2,textTransform:'uppercase',color:C.dim,marginBottom:6}}>{children}</div>;

  </div>

);
const SecLabel=({children})=><div style={{fontSize:9,fontWeight:800,letterSpacing:2,textTransform:'uppercase',color:C.dim,margin:'14px 0 8px 2px'}}>{children}</div>;
const Badge=({children,color})=><span style={{fontSize:11,fontWeight:700,padding:'3px 9px',borderRadius:7,background:(color||C.blue)+'18',color:color||C.blue,display:'inline-block'}}>{children}</span>;

const Hdr=({title,sub,onBack,onAdd,children})=>(
  <div style={{padding:'14px 16px 12px',background:'rgba(9,9,15,.97)',backdropFilter:'blur(20px)',borderBottom:`1px solid ${C.border}`,position:'sticky',top:0,zIndex:50,display:'flex',alignItems:'center',gap:10}}>
    {onBack&&<button onClick={onBack} style={{width:38,height:38,borderRadius:11,background:C.bg2,border:`1px solid ${C.border}`,color:C.muted,fontSize:22,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>←</button>}
    <div style={{flex:1}}><div style={{fontSize:9,fontWeight:800,letterSpacing:2.5,textTransform:'uppercase',color:C.dim}}>{sub||'KASSACONTROL'}</div><div style={{fontSize:20,fontWeight:900,letterSpacing:-.5}}>{title}</div></div>
    {onAdd&&<button onClick={onAdd} style={{width:40,height:40,borderRadius:12,background:C.blue,border:'none',color:'#fff',fontSize:28,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,lineHeight:1,paddingBottom:2}}>+</button>}
    {children}
  </div>
);
const Toast=({msg,color})=>msg?<div style={{position:'fixed',bottom:90,left:'50%',transform:'translateX(-50%)',background:C.bg2,border:`1.5px solid ${color||C.green}`,borderRadius:14,padding:'12px 22px',fontSize:14,fontWeight:700,color:C.text,zIndex:999,whiteSpace:'nowrap',boxShadow:'0 8px 40px rgba(0,0,0,.6)',pointerEvents:'none'}}>{msg}</div>:null;

function Home({tick}){
  const [period,setPeriod]=useState('day');
  const t=tod(),ws=weekStart(),ms=monStr();
  const filterD=d=>period==='day'?d===t:period==='week'?d>=ws:period==='month'?d.startsWith(ms):true;
  const rev=dbGet('revenue'),exp=dbGet('expenses'),cash=dbGet('cash_movements');
  const diItems=dbGet('delivery_items'),revisions=dbGet('revisions'),riItems=dbGet('revision_items');
  const totalRev=rev.filter(r=>filterD(r.date)).reduce((s,r)=>s+ +r.amount,0);
  const totalGbs=rev.filter(r=>filterD(r.date)).reduce((s,r)=>s+ +(r.profit||0),0);
  const totalExp=exp.filter(e=>filterD(e.date)).reduce((s,e)=>s+ +e.amount,0);
  const cleanP=totalGbs-totalExp;
  const gbsPct=totalRev>0?Math.round((totalGbs/totalRev)*100):0;
  const cleanPct=totalRev>0?Math.round((cleanP/totalRev)*100):0;
  let cashBal=0; cash.forEach(m=>{ if(m.type==='add'||m.type==='revenue') cashBal+= +m.amount; else cashBal-= +m.amount; });

  // ✅ FIFO-фильтр как в разделе Сроки
  const products=dbGet('products');
  const allExpItems=diItems.filter(i=>i.expiry_date&&(+i.quantity||0)>0);
  const fifoItems=calcFifoRemaining(allExpItems,products);
  const withExp=fifoItems.filter(i=>i.remaining>0);
  const expired=withExp.filter(i=>dLeft(i.expiry_date)<0);
  const critical=withExp.filter(i=>{ const d=dLeft(i.expiry_date); return d>=0&&d<=3; });
  const soon=withExp.filter(i=>{ const d=dLeft(i.expiry_date); return d>3&&d<=7; });

  const periodRevs=revisions.filter(r=>filterD(r.date));
  const lastRev=[...revisions].sort((a,b)=>b.created_at.localeCompare(a.created_at))[0];
  const activeRevs=periodRevs.length>0?periodRevs:[lastRev].filter(Boolean);
  const lrItems=riItems.filter(i=>activeRevs.some(r=>r.id===i.revision_id));
  const lrChecked=lrItems.filter(i=>i.actual!==null);
  const lrShort=lrChecked.filter(i=>i.actual<i.expected);
  const lrSumExp=lrChecked.reduce((s,i)=>s+i.expected*(i.price||0),0);
  const lrSumAct=lrChecked.reduce((s,i)=>s+i.actual*(i.price||0),0);
  const lrLoss=lrSumExp-lrSumAct;
  const dateLabel=new Date(Date.now()+OFFSET).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const hasAlert=(expired.length+critical.length)>0;

  return(
    <>
      <div style={{padding:'16px 16px 12px',background:'rgba(9,9,15,.97)',backdropFilter:'blur(20px)',borderBottom:`1px solid ${C.border}`,position:'sticky',top:0,zIndex:50}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <div><div style={{fontSize:9,fontWeight:800,letterSpacing:2,color:C.dim,textTransform:'uppercase',marginBottom:3}}>{dateLabel}</div><div style={{fontSize:22,fontWeight:900,letterSpacing:-.5}}>🏪 KassaControl</div></div>
          {hasAlert&&<div style={{background:'#f04f5a18',border:'1px solid #f04f5a50',borderRadius:14,padding:'6px 14px',textAlign:'center'}}><div style={{fontSize:9,color:C.red,fontWeight:800}}>ВНИМАНИЕ</div><div style={{fontSize:18,fontWeight:900,color:C.red}}>☠ {expired.length+critical.length}</div></div>}
        </div>
        <div style={{display:'flex',gap:6}}>
          {[['day','День'],['week','Неделя'],['month','Месяц'],['all','Всё']].map(([id,l])=>(
            <button key={id} onClick={()=>setPeriod(id)} style={{flex:1,padding:'8px 4px',borderRadius:10,cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:800,border:`1.5px solid ${period===id?C.blue+'60':C.border}`,background:period===id?C.blue+'18':C.bg2,color:period===id?C.blue:C.dim}}>{l}</button>
          ))}
        </div>
      </div>
      <div style={{padding:14,paddingBottom:30}}>
        <div style={{background:`linear-gradient(135deg,${cleanP>=0?'#0d2d1a':'#2d0d12'},${C.bg2})`,border:`1.5px solid ${cleanP>=0?C.green+'50':C.red+'50'}`,borderRadius:20,padding:'20px',marginBottom:12,textAlign:'center'}}>
          <div style={{fontSize:9,fontWeight:800,letterSpacing:2.5,color:C.dim,marginBottom:8}}>ЧИСТАЯ ПРИБЫЛЬ</div>
          <div style={{fontSize:48,fontWeight:900,color:cleanP>=0?C.green:C.red,letterSpacing:-2,lineHeight:1}}>{cleanP>=0?'+':''}{fmt(cleanP)}</div>
          <div style={{fontSize:13,color:C.dim,marginTop:5}}>SM · {cleanPct}% от выручки</div>
          <div style={{fontSize:11,color:C.dim,marginTop:4}}>Прибыль GBS ({fmt(totalGbs)} SM) − Расходы ({fmt(totalExp)} SM)</div>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <div style={{flex:1,background:C.bg2,border:`1px solid ${C.green}30`,borderRadius:16,padding:'14px 12px'}}>
            <div style={{fontSize:9,fontWeight:800,letterSpacing:1.5,color:C.dim,textTransform:'uppercase',marginBottom:6}}>Выручка</div>
            <div style={{fontSize:20,fontWeight:900,color:C.green}}>{fmt(totalRev)}</div>
            <div style={{fontSize:10,color:C.dim,marginTop:3}}>SM · маржа {gbsPct}%</div>
          </div>
          <div style={{flex:1,background:C.bg2,border:`1px solid ${C.red}30`,borderRadius:16,padding:'14px 12px'}}>
            <div style={{fontSize:9,fontWeight:800,letterSpacing:1.5,color:C.dim,textTransform:'uppercase',marginBottom:6}}>Расходы</div>
            <div style={{fontSize:20,fontWeight:900,color:C.red}}>−{fmt(totalExp)}</div>
            <div style={{fontSize:10,color:C.dim,marginTop:3}}>SM</div>
          </div>
        </div>
        <div style={{background:C.bg2,border:`1.5px solid ${cashBal>=0?C.blue+'40':C.red+'40'}`,borderRadius:16,padding:'14px 16px',marginBottom:12,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div><div style={{fontSize:9,fontWeight:800,letterSpacing:2,color:C.dim,marginBottom:4}}>🏧 НАЛИЧНЫЕ В КАССЕ</div><div style={{fontSize:28,fontWeight:900,color:cashBal>=0?C.blue:C.red}}>{fmt(Math.abs(cashBal))} SM</div></div>
          <div style={{fontSize:40,opacity:.35}}>🏧</div>
        </div>
        <div style={{background:C.bg2,border:`1px solid ${(expired.length+critical.length)>0?C.red+'40':C.border}`,borderRadius:16,overflow:'hidden',marginBottom:12}}>
          <div style={{padding:'10px 16px',background:C.bg3,borderBottom:`1px solid ${C.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontSize:10,fontWeight:800,letterSpacing:2,color:C.dim}}>☠️ СРОКИ ГОДНОСТИ</div>
            {(expired.length+critical.length)>0&&<div style={{fontSize:11,fontWeight:800,color:C.red}}>Требует внимания!</div>}
          </div>
          <div style={{display:'flex'}}>
            {[['Просрочено',expired.length,C.red,'☠'],['Критично',critical.length,C.orange,'⚠'],['Скоро',soon.length,C.yellow,'!']].map(([l,n,c,ic])=>(
              <div key={l} style={{flex:1,padding:'13px 10px',textAlign:'center',borderRight:l!=='Скоро'?`1px solid ${C.border}`:'none'}}>
                <div style={{fontSize:9,fontWeight:800,color:C.dim,marginBottom:4}}>{l}</div>
                <div style={{fontSize:24,fontWeight:900,color:n>0?c:C.dim}}>{n}</div>
                <div style={{fontSize:12,marginTop:2}}>{n>0?ic:'✓'}</div>
              </div>
            ))}
          </div>
          {expired.slice(0,2).map(item=>(
            <div key={item.id} style={{display:'flex',justifyContent:'space-between',padding:'8px 16px',borderTop:`1px solid ${C.red}25`}}>
              <div style={{fontSize:13}}>{item.product_name}</div>
              <div style={{fontSize:11,fontWeight:800,color:C.red}}>☠ {Math.abs(dLeft(item.expiry_date))}д назад</div>
            </div>
          ))}
        </div>
        {activeRevs.length>0&&(
          <div style={{background:C.bg2,border:`1px solid ${lrShort.length>0?C.red+'35':C.border}`,borderRadius:16,overflow:'hidden',marginBottom:12}}>
            <div style={{padding:'10px 16px',background:C.bg3,borderBottom:`1px solid ${C.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontSize:10,fontWeight:800,letterSpacing:2,color:C.dim}}>📦 РЕВИЗИЯ{activeRevs.length>1?` · ${activeRevs.length} ШТ`:` · ${fmtD(activeRevs[0]?.date||'').toUpperCase()}`}</div>
            </div>
            <div style={{display:'flex'}}>
              {[['Позиций',lrItems.length,C.blue],['Недостача',lrShort.length,lrShort.length>0?C.red:C.green],['Потери',lrLoss>0?`-${fmt(lrLoss)} SM`:'✓ 0',lrLoss>0?C.red:C.green]].map(([l,v,c])=>(
                <div key={l} style={{flex:1,padding:'13px 10px',textAlign:'center',borderRight:l!=='Потери'?`1px solid ${C.border}`:'none'}}>
                  <div style={{fontSize:9,fontWeight:800,color:C.dim,marginBottom:4}}>{l}</div>
                  <div style={{fontSize:l==='Потери'?14:22,fontWeight:900,color:c}}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        )}
        {exp.filter(e=>filterD(e.date)).length>0&&(()=>{
          const byR={}; exp.filter(e=>filterD(e.date)).forEach(e=>{ byR[e.reason]=(byR[e.reason]||0)+ +e.amount; });
          return(
            <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:16,overflow:'hidden'}}>
              <div style={{padding:'10px 16px',background:C.bg3,borderBottom:`1px solid ${C.border}`}}><div style={{fontSize:10,fontWeight:800,letterSpacing:2,color:C.dim}}>💸 РАСХОДЫ ПО СТАТЬЯМ</div></div>
              {Object.entries(byR).sort((a,b)=>b[1]-a[1]).map(([r,a])=>(
                <div key={r} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'11px 16px',borderBottom:`1px solid ${C.border}`}}>
                  <div style={{fontSize:13,color:C.muted}}>{r}</div>
                  <div style={{fontSize:14,fontWeight:800,color:C.red}}>−{fmt(a)} SM</div>
                </div>
              ))}
            </div>
          );
        })()}
        {(()=>{
          const events=[];
          rev.filter(r=>filterD(r.date)).forEach(r=>events.push({id:'rv'+r.id,time:r.created_at,icon:'💰',color:C.green,title:`+${fmt(r.amount)} SM`,sub:'Выручка'+(r.profit?` · GBS: ${fmt(r.profit)} SM`:''),date:r.date}));

    </>
  );
}

function Posting({supplier,onBack,onSaved}){
  const [date,setDate]=useState(tod());
  const [search,setSearch]=useState('');
  const [selected,setSelected]=useState(null);
  const [qty,setQty]=useState('');
  const [expiry,setExpiry]=useState('');
  const [addedItems,setAddedItems]=useState([]);
  const [editId,setEditId]=useState(null);
  const [editQty,setEditQty]=useState('');
  const [editExp,setEditExp]=useState('');
  const [err,setErr]=useState('');
  const catalog=dbGet('products');
  const results=search.trim().length>=1?(()=>{
    const q=search.trim(),ql=q.toLowerCase(),isNum=/^\d+$/.test(q);
    const all=catalog.filter(p=>p.name.toLowerCase().includes(ql)||(p.barcode&&p.barcode.includes(q)));
    all.sort((a,b)=>{
      const score=p=>{ const bar=p.barcode||'',nm=p.name.toLowerCase();
        if(isNum){ if(bar===q)return 0; if(bar.endsWith(q))return 1; if(bar.startsWith(q))return 2; if(bar.includes(q))return 3; if(nm.includes(ql))return 4; return 5; }
        else{ if(nm===ql)return 0; if(nm.startsWith(ql))return 1; if(nm.includes(ql))return 2; if(bar.includes(q))return 3; return 4; }
      };
      return score(a)-score(b);
    });
    return all.slice(0,10);
  })():[];
  const addToList=()=>{ if(!qty||+qty<=0){setErr('Введите количество');return;} setAddedItems(prev=>[...prev,{id:uid(),product_id:selected.id,name:selected.name,barcode:selected.barcode,qty:+qty,unit:selected.unit,category:selected.category,expiry:expiry||null}]); setSelected(null);setQty('');setExpiry('');setErr(''); };
  const saveAll=async()=>{
    if(!addedItems.length)return;
    const del=await dbInsert('deliveries',{supplier_id:supplier.id,supplier_name:supplier.name,date});
    await dbInsertMany('delivery_items',addedItems.map(item=>({delivery_id:del.id,product_name:item.name,barcode:item.barcode,quantity:item.qty,unit:item.unit,category:item.category,expiry_date:item.expiry||null})));
    onSaved(addedItems.length);
  };
  return(
    <><Hdr title="Поступление" sub={supplier.name.toUpperCase()} onBack={onBack}/>
    <div style={{padding:14,paddingBottom:30}}>

function calcFifoRemaining(deliveryItems,products){
  const byBarcode={};
  deliveryItems.filter(i=>i.expiry_date&&i.barcode&&(+i.quantity||0)>0).forEach(i=>{ if(!byBarcode[i.barcode])byBarcode[i.barcode]=[]; byBarcode[i.barcode].push({...i}); });
  const result=[];
  Object.entries(byBarcode).forEach(([barcode,batches])=>{
    const prod=products.find(p=>p.barcode===barcode);
    const currentStock=prod?(prod.stock||0):null;
    const sorted=[...batches].sort((a,b)=>{ const da=dbGet('deliveries').find(d=>d.id===a.delivery_id); const db2=dbGet('deliveries').find(d=>d.id===b.delivery_id); return(da?.date||'').localeCompare(db2?.date||''); });
    if(currentStock===null){ sorted.forEach(b=>result.push({...b,remaining:b.quantity})); return; }
    let leftToSell=Math.max(0,sorted.reduce((s,b)=>s+b.quantity,0)-currentStock);
    sorted.forEach(batch=>{ let remaining=batch.quantity; if(leftToSell>0){const deduct=Math.min(leftToSell,batch.quantity);remaining=batch.quantity-deduct;leftToSell-=deduct;} result.push({...batch,remaining,originalQty:batch.quantity}); });
  });
  deliveryItems.filter(i=>i.expiry_date&&!i.barcode&&(+i.quantity||0)>0).forEach(i=>{ result.push({...i,remaining:i.quantity}); });
  return result;
}

function Expiry({tick}){
  const [filter,setFilter]=useState('all');

  const doRefresh=async()=>{
    setRefreshing(true);
    const prod=await fetchAllProducts();
    DB.products=Array.isArray(prod)?prod:[];
    pub();
    setRefreshing(false);
  };

  const doWriteOff=async(item,qty)=>{
    const newQty=Math.max(0,(+item.quantity||0)-(+qty||0));
    await fetch(`${SB}/delivery_items?id=eq.${item.id}`,{method:'PATCH',headers:H,body:JSON.stringify({quantity:newQty})});
    const idx=DB.delivery_items.findIndex(i=>i.id===item.id);
    if(idx>=0) DB.delivery_items[idx]={...DB.delivery_items[idx],quantity:newQty};
    setWriteOff(p=>({...p,[item.id]:''}));
    pub();
  };
  const allItems=dbGet('delivery_items').filter(i=>i.expiry_date&&(+i.quantity||0)>0);
  const products=dbGet('products');
  const dels=dbGet('deliveries');
  const delMap=Object.fromEntries(dels.map(d=>[d.id,d]));
  const itemsWithRemaining=calcFifoRemaining(allItems,products);

          ))}
        </div>
        {!filtered.length?<Empty icon="✅" text="Всё в норме"/>:
        filtered.map(item=>{
          const st={icon:item.days<0?'☠️':item.days<=3?'⚠️':item.days<=7?'❗':'✅',color:eColor(item.days),label:eText(item.days)};
          return(
            <div key={item.id} className="fu" style={{background:C.bg2,border:`1px solid ${item.days<0?C.red+'35':item.days<=3?C.orange+'35':C.border}`,borderRadius:18,marginBottom:10,overflow:'hidden',display:'flex'}}>

      <div style={{background:C.bg3,borderRadius:10,padding:'5px 12px',textAlign:'center',flexShrink:0}}><div style={{fontSize:9,color:C.dim,fontWeight:700}}>Проверено</div><div style={{fontSize:15,fontWeight:900,color:checked===items.length&&checked>0?C.green:C.blue}}>{checked}/{items.length}</div></div>
    </Hdr>
    <div style={{padding:14,paddingBottom:160}}>
      {checked>0&&(
        <div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:16,overflow:'hidden',marginBottom:12}}>
          <div style={{display:'flex',borderBottom:`1px solid ${C.border}`}}>
            <div style={{flex:1,padding:'14px 16px',borderRight:`1px solid ${C.border}`,textAlign:'center'}}><div style={{fontSize:9,fontWeight:800,color:C.dim,marginBottom:4}}>БЫЛО</div><div style={{fontSize:18,fontWeight:900,color:C.muted}}>{fmt(sumExp)} SM</div></div>
            <div style={{flex:1,padding:'14px 16px',textAlign:'center'}}><div style={{fontSize:9,fontWeight:800,color:C.dim,marginBottom:4}}>ОСТАЛОСЬ</div><div style={{fontSize:18,fontWeight:900,color:sumExp-sumAct>0?C.red:C.green}}>{fmt(sumAct)} SM</div></div>
          </div>
          <div style={{padding:'12px 16px',background:sumExp-sumAct>0?'#f04f5a10':'#3ecf8e10',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontSize:10,fontWeight:800,color:C.dim}}>{sumExp-sumAct>0?'ПОТЕРИ':'РЕЗУЛЬТАТ'}</div>
            <div style={{fontSize:20,fontWeight:900,color:sumExp-sumAct>0?C.red:C.green}}>{sumExp-sumAct>0?'-':''}{fmt(Math.abs(sumExp-sumAct))} SM</div>
          </div>
        </div>
      )}
      <Card style={{background:C.bg3,border:`1px solid #4466ff25`}}>
        <div style={{fontSize:10,fontWeight:800,letterSpacing:2,color:C.blue,marginBottom:8}}>🔍 ДОБАВИТЬ ПО ШТРИХКОДУ</div>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Введи название или штрихкод..." style={{width:'100%',background:C.bg,border:`1.5px solid #4466ff40`,borderRadius:11,padding:'12px 14px',color:C.text,fontSize:14,outline:'none',WebkitAppearance:'none'}}/>
        {search.trim()&&searchProds.map(p=>(<div key={p.id} onClick={()=>addFromSearch(p)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:C.bg2,borderRadius:10,marginTop:6,cursor:'pointer'}}><div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{p.product_name}</div><div style={{fontSize:11,color:C.dim}}>🏷 {p.barcode} · {p.totalQty} {p.unit}</div></div><div style={{color:C.blue,fontSize:20,fontWeight:300}}>+</div></div>))}
      </Card>
      {visItems.map(ri=>{
        const diff=ri.actual!==null?ri.actual-ri.product.totalQty:null;
        const dc=diff===null?C.dim:diff<0?C.red:diff>0?C.orange:C.green;
        return(
          <div key={ri.id} className="fu" style={{background:C.bg2,border:`1px solid ${diff===null?C.border:diff<0?C.red+'40':C.green+'30'}`,borderRadius:16,marginBottom:8,overflow:'hidden',display:'flex'}}>
            <div style={{width:4,background:diff===null?C.border:dc+'cc',flexShrink:0}}/>
            <div style={{flex:1,padding:'12px 14px 12px 10px'}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:800,marginBottom:3}}>{ri.product.product_name}</div><div style={{fontSize:11,color:C.dim,marginBottom:4}}>🏷 {ri.product.barcode}</div><div style={{fontSize:12,color:C.dim}}>Ожидается: <b style={{color:C.muted}}>{ri.product.totalQty} {ri.product.unit}</b>{ri.product.price>0&&<> · <b style={{color:C.blue}}>{ri.product.price} SM</b></>}</div></div>
                <div style={{flexShrink:0,textAlign:'right'}}><div style={{fontSize:9,fontWeight:800,letterSpacing:1.5,color:C.dim,marginBottom:4}}>ФАКТ</div><input type="number" placeholder={String(ri.product.totalQty)} value={ri.actual??''} onChange={e=>updActual(ri.id,e.target.value)} style={{width:72,padding:'9px 6px',borderRadius:11,textAlign:'center',background:C.bg,border:`1.5px solid ${diff===null?C.border:dc}`,color:diff===null?C.text:dc,fontSize:18,fontWeight:900,fontFamily:'inherit',outline:'none',boxSizing:'border-box'}}/>{diff!==null&&<div style={{fontSize:13,fontWeight:900,color:dc,marginTop:4}}>{diff>0?'+':''}{diff}</div>}</div>
              </div>
              {diff!==null&&(<div style={{marginTop:8,padding:'7px 10px',borderRadius:9,background:dc+'12',display:'flex',justifyContent:'space-between'}}><span style={{fontSize:12,fontWeight:800,color:dc}}>{diff<0?`↓ Недостача ${Math.abs(diff)} ${ri.product.unit}`:diff>0?`↑ Излишек ${diff} ${ri.product.unit}`:'✓ Совпадает'}</span>{ri.product.price>0&&diff!==0&&<span style={{fontSize:13,fontWeight:900,color:dc}}>{diff<0?'-':'+'}{(Math.abs(diff)*ri.product.price).toFixed(2)} SM</span>}</div>)}
            </div>
          </div>
        );
      })}
      {items.length>page*PAGE&&(<button onClick={()=>setPage(p=>p+1)} style={{width:'100%',padding:'14px',borderRadius:14,background:C.bg2,border:`1px solid ${C.blue}40`,color:C.blue,fontSize:14,fontWeight:800,cursor:'pointer',fontFamily:'inherit',marginBottom:8}}>Загрузить ещё {Math.min(PAGE,items.length-page*PAGE)} ({page*PAGE} из {items.length})</button>)}
    </div>
    <div style={{position:'fixed',bottom:64,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:430,padding:'10px 14px',background:'rgba(9,9,15,.97)',borderTop:`1px solid ${C.border}`,zIndex:150}}>
      {saved?<div style={{textAlign:'center',padding:14,fontSize:16,fontWeight:800,color:C.green}}>✓ Ревизия сохранена!</div>:
      <Btn bg={checked>0?C.green:C.bg3} color={checked>0?'#051a0e':C.dim} onClick={saveRev} disabled={checked===0}>{checked===0?'Введи данные для сохранения':`✓ Сохранить · ${checked}/${items.length} проверено`}</Btn>}
    </div></>
  );
}

function RevisionView({revision,onBack,onDeleted}){
  const [confirmDel,setConfirmDel]=useState(false);
  const [editMode,setEditMode]=useState(false);
  const [editValues,setEditValues]=useState({});
  const [saving,setSaving]=useState(false);
  const items=dbGet('revision_items').filter(i=>i.revision_id===revision.id);
  const short=items.filter(i=>i.actual!==null&&i.actual<i.expected);
  const sumExp=items.filter(i=>i.actual!==null).reduce((s,i)=>s+i.expected*(i.price||0),0);
  const sumAct=items.filter(i=>i.actual!==null).reduce((s,i)=>s+i.actual*(i.price||0),0);
  const loss=sumExp-sumAct;
  const startEdit=()=>{ const vals={}; items.forEach(i=>{ vals[i.id]=i.actual!==null?String(i.actual):''; }); setEditValues(vals); setEditMode(true); };
  const saveEdit=async()=>{ setSaving(true); for(const item of items){ const val=editValues[item.id]; const actual=val===''?null:+val; await fetch(`${SB}/revision_items?id=eq.${item.id}`,{method:'PATCH',headers:H,body:JSON.stringify({actual})}); const idx=DB.revision_items.findIndex(i=>i.id===item.id); if(idx>=0)DB.revision_items[idx]={...DB.revision_items[idx],actual}; } pub(); setEditMode(false); setSaving(false); };
  const doDelete=async()=>{ for(const item of items) await sbDel('revision_items',item.id); await sbDel('revisions',revision.id); DB.revision_items=DB.revision_items.filter(i=>i.revision_id!==revision.id); DB.revisions=DB.revisions.filter(r=>r.id!==revision.id); pub(); onDeleted(); };
  return(
    <><Hdr title={fmtD(revision.date)} sub={(revision.category||'РЕВИЗИЯ').toUpperCase()} onBack={onBack}>
      <div style={{display:'flex',gap:6}}>
        {!editMode&&<button onClick={startEdit} style={{width:38,height:38,borderRadius:11,background:'#4466ff18',border:`1px solid #4466ff40`,color:C.blue,fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✏️</button>}
        <button onClick={()=>setConfirmDel(true)} style={{width:38,height:38,borderRadius:11,background:'#f04f5a18',border:`1px solid #f04f5a40`,color:C.red,fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>🗑</button>
      </div>
    </Hdr>
    {confirmDel&&(<div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,.7)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}><div style={{background:C.bg2,border:`1px solid ${C.red}50`,borderRadius:20,padding:24,width:'100%',maxWidth:380}}><div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Удалить ревизию?</div><div style={{fontSize:13,color:C.dim,marginBottom:20}}>Ревизия от {fmtD(revision.date)} · {items.length} позиций будет удалена безвозвратно</div><div style={{display:'flex',gap:10}}><Btn outline onClick={()=>setConfirmDel(false)} style={{flex:1,padding:'12px 0'}}>Отмена</Btn><Btn bg={C.red} onClick={doDelete} style={{flex:1,padding:'12px 0'}}>Удалить</Btn></div></div></div>)}
    <div style={{padding:14,paddingBottom:editMode?160:30}}>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        {[['Позиций',items.length,C.blue],['Недостача',short.length,short.length>0?C.red:C.green]].map(([l,v,c])=>(<div key={l} style={{flex:1,background:C.bg2,border:`1px solid ${C.border}`,borderRadius:14,padding:'13px 10px',textAlign:'center'}}><div style={{fontSize:9,color:C.dim,fontWeight:800,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>{l}</div><div style={{fontSize:20,fontWeight:900,color:c}}>{v}</div></div>))}
      </div>
      {items.filter(i=>i.actual!==null).length>0&&(<div style={{background:C.bg2,border:`1px solid ${C.border}`,borderRadius:16,overflow:'hidden',marginBottom:12}}><div style={{display:'flex',borderBottom:`1px solid ${C.border}`}}><div style={{flex:1,padding:'14px 16px',borderRight:`1px solid ${C.border}`,textAlign:'center'}}><div style={{fontSize:9,fontWeight:800,color:C.dim,marginBottom:4}}>БЫЛО</div><div style={{fontSize:18,fontWeight:900,color:C.muted}}>{fmt(sumExp)} SM</div></div><div style={{flex:1,padding:'14px 16px',textAlign:'center'}}><div style={{fontSize:9,fontWeight:800,color:C.dim,marginBottom:4}}>ОСТАЛОСЬ</div><div style={{fontSize:18,fontWeight:900,color:loss>0?C.red:C.green}}>{fmt(sumAct)} SM</div></div></div><div style={{padding:'12px 16px',background:loss>0?'#f04f5a10':'#3ecf8e10',display:'flex',justifyContent:'space-between'}}><div style={{fontSize:10,fontWeight:800,color:C.dim}}>{loss>0?'ПОТЕРИ':'РЕЗУЛЬТАТ'}</div><div style={{fontSize:22,fontWeight:900,color:loss>0?C.red:C.green}}>{loss>0?'-':''}{fmt(Math.abs(loss))} SM</div></div></div>)}
      <Card>
        {items.map((item,i)=>{ const val=editMode?editValues[item.id]??'':null; const actual=editMode?(val===''?null:+val):item.actual; const diff=actual!==null?actual-item.expected:null; const dc=diff===null?C.dim:diff<0?C.red:diff>0?C.orange:C.green;
          return(<div key={item.id} style={{padding:'12px 0',borderBottom:i<items.length-1?`1px solid ${C.border}`:'none'}}><div style={{display:'flex',alignItems:'center',gap:10}}><div style={{flex:1}}><div style={{fontSize:14,fontWeight:800,marginBottom:3}}>{item.product_name}</div>{item.barcode&&<div style={{fontSize:11,color:C.dim}}>🏷 {item.barcode}</div>}</div><div style={{textAlign:'right',flexShrink:0}}>{editMode?(<div><div style={{fontSize:11,color:C.dim,marginBottom:4}}>Ожид: <b>{item.expected}</b></div><input type="number" value={editValues[item.id]??''} onChange={e=>setEditValues(prev=>({...prev,[item.id]:e.target.value}))} style={{width:70,padding:'7px 6px',borderRadius:9,textAlign:'center',background:C.bg,border:`1.5px solid ${dc}`,color:dc,fontSize:16,fontWeight:900,fontFamily:'inherit',outline:'none',boxSizing:'border-box'}}/>{diff!==null&&<div style={{fontSize:12,fontWeight:800,color:dc,marginTop:3}}>{diff>0?'+':''}{diff}</div>}</div>):(<div><div style={{display:'flex',gap:6,justifyContent:'flex-end',marginBottom:4}}><span style={{fontSize:11,color:C.dim}}>Ожид: <b style={{color:C.muted}}>{item.expected}</b></span>{item.actual!==null&&<span style={{fontSize:11,color:C.dim}}>Факт: <b style={{color:dc}}>{item.actual}</b></span>}</div>{diff!==null&&<span style={{fontSize:13,fontWeight:900,padding:'3px 10px',borderRadius:8,background:dc+'18',color:dc,display:'inline-block'}}>{diff>0?'+':''}{diff} {item.unit}</span>}</div>)}</div></div></div>);
        })}
      </Card>
    </div>
    {editMode&&(<div style={{position:'fixed',bottom:64,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:430,padding:'10px 14px',background:'rgba(9,9,15,.97)',borderTop:`1px solid ${C.border}`,zIndex:150,display:'flex',gap:8}}><Btn outline onClick={()=>setEditMode(false)} style={{width:52,flex:'none',padding:'14px 0'}}>✕</Btn><Btn bg={C.green} color="#051a0e" onClick={saveEdit} disabled={saving} style={{flex:1}}>{saving?'Сохранение...':'✓ Сохранить изменения'}</Btn></div>)}
    </>
  );
}

function DebtsTab({tick}){
  const [name,setName]=useState('');
  const [amount,setAmount]=useState('');
  const [type,setType]=useState('given');
  const [desc,setDesc]=useState('');
  const [repayVals,setRepayVals]=useState({});
  const [delItem,setDelItem]=useState(null);
  const [view,setView]=useState('active');

  const debts=dbGet('debts').sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const active=debts.filter(d=>d.status==='active');
  const paid=debts.filter(d=>d.status==='paid');
  const totalGiven=active.filter(d=>d.type==='given').reduce((s,d)=>s+(+d.remaining_amount||0),0);
  const totalTaken=active.filter(d=>d.type==='taken').reduce((s,d)=>s+(+d.remaining_amount||0),0);
  const balance=totalGiven-totalTaken;

  const save=async()=>{
    if(!name.trim()||!amount)return;
    await dbInsert('debts',{name:name.trim(),amount:+amount,remaining_amount:+amount,type,description:desc.trim(),date:tod(),status:'active'});
    if(type==='given') await dbInsert('cash_movements',{type:'remove',amount:+amount,description:`💳 Дал в долг: ${name.trim()}`,date:tod()});
    else await dbInsert('cash_movements',{type:'add',amount:+amount,description:`💳 Взял в долг: ${name.trim()}`,date:tod()});
    setName('');setAmount('');setDesc('');
  };

  const repay=async(debt,val)=>{
    const amt=Math.min(+val||0,+debt.remaining_amount||0);
    if(amt<=0)return;
    const newRem=+(+debt.remaining_amount-amt).toFixed(2);
    const newStatus=newRem<=0?'paid':'active';
    await fetch(`${SB}/debts?id=eq.${debt.id}`,{method:'PATCH',headers:H,body:JSON.stringify({remaining_amount:newRem,status:newStatus})});
    const idx=DB.debts.findIndex(d=>d.id===debt.id);
    if(idx>=0) DB.debts[idx]={...DB.debts[idx],remaining_amount:newRem,status:newStatus};
    if(debt.type==='given') await dbInsert('cash_movements',{type:'add',amount:amt,description:`↩ Вернули долг: ${debt.name}`,date:tod()});
    else await dbInsert('cash_movements',{type:'remove',amount:amt,description:`↩ Вернул долг: ${debt.name}`,date:tod()});
    setRepayVals(p=>({...p,[debt.id]:''}));
    pub();
  };

  return(
    <div style={{padding:14,paddingBottom:30}}>
      {delItem&&<DelConfirm text={`Удалить долг «${delItem.name}» ${fmt(delItem.remaining_amount)} SM?`} onConfirm={async()=>{await dbDelete('debts',delItem.id);setDelItem(null);}} onCancel={()=>setDelItem(null)}/>}

      {/* Итоги */}
      <div style={{background:`linear-gradient(135deg,${balance>=0?'#0d2d1a':'#2d0d12'},${C.bg2})`,border:`1.5px solid ${balance>=0?C.green+'50':C.red+'50'}`,borderRadius:20,padding:'18px 20px',marginBottom:12,textAlign:'center'}}>
        <div style={{fontSize:9,fontWeight:800,letterSpacing:2.5,color:C.dim,marginBottom:6}}>БАЛАНС ДОЛГОВ</div>
        <div style={{fontSize:40,fontWeight:900,color:balance>=0?C.green:C.red,letterSpacing:-1}}>{balance>=0?'+':''}{fmt(balance)} SM</div>
        <div style={{display:'flex',justifyContent:'center',gap:24,marginTop:10}}>
          <div style={{textAlign:'center'}}><div style={{fontSize:9,color:C.dim,fontWeight:800,marginBottom:2}}>💸 МНЕ ДОЛЖНЫ</div><div style={{fontSize:15,fontWeight:900,color:C.green}}>{fmt(totalGiven)} SM</div></div>
          <div style={{width:1,background:C.border}}/>
          <div style={{textAlign:'center'}}><div style={{fontSize:9,color:C.dim,fontWeight:800,marginBottom:2}}>💰 Я ДОЛЖЕН</div><div style={{fontSize:15,fontWeight:900,color:C.red}}>{fmt(totalTaken)} SM</div></div>
        </div>
      </div>

      {/* Форма */}
      <Card>
        <div style={{fontSize:11,fontWeight:800,letterSpacing:2,color:C.dim,marginBottom:12}}>НОВЫЙ ДОЛГ</div>
        <div style={{display:'flex',gap:8,marginBottom:14}}>
          <button onClick={()=>setType('given')} style={{flex:1,padding:'12px 8px',borderRadius:12,cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:800,border:`1.5px solid ${type==='given'?C.green+'70':C.border}`,background:type==='given'?C.green+'18':C.bg2,color:type==='given'?C.green:C.dim}}>💸 Дал в долг</button>
          <button onClick={()=>setType('taken')} style={{flex:1,padding:'12px 8px',borderRadius:12,cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:800,border:`1.5px solid ${type==='taken'?C.red+'70':C.border}`,background:type==='taken'?C.red+'18':C.bg2,color:type==='taken'?C.red:C.dim}}>💰 Взял в долг</button>
        </div>
        <TI label="КТО (имя / фирма)" placeholder="Например: Алишер, Фирма Сорбон..." value={name} onChange={setName} autoFocus/>
        <TI label="СУММА (SM)" type="number" placeholder="0.00" value={amount} onChange={setAmount}/>
        <TI label="ОПИСАНИЕ (необязательно)" placeholder="Причина..." value={desc} onChange={setDesc}/>
        <Btn bg={type==='given'?C.green:C.red} color={type==='given'?'#051a0e':'#fff'} onClick={save} disabled={!name.trim()||!amount}>
          {type==='given'?'💸 Дал в долг → спишется с кассы':'💰 Взял в долг → добавится в кассу'}
        </Btn>
      </Card>

      {/* Вкладки */}
      <div style={{display:'flex',gap:6,marginBottom:14}}>
        <button onClick={()=>setView('active')} style={{flex:1,padding:'10px',borderRadius:11,cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:800,border:`1.5px solid ${view==='active'?C.blue+'60':C.border}`,background:view==='active'?C.blue+'18':C.bg2,color:view==='active'?C.blue:C.dim}}>⏳ Активные · {active.length}</button>
        <button onClick={()=>setView('history')} style={{flex:1,padding:'10px',borderRadius:11,cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:800,border:`1.5px solid ${view==='history'?C.green+'60':C.border}`,background:view==='history'?C.green+'18':C.bg2,color:view==='history'?C.green:C.dim}}>✅ Закрытые · {paid.length}</button>
      </div>

      {/* Список */}
      {(view==='active'?active:paid).length===0?<Empty icon={view==='active'?'🤝':'✅'} text={view==='active'?'Нет активных долгов':'Нет закрытых долгов'}/>:
      (view==='active'?active:paid).map(debt=>{
        const isGiven=debt.type==='given';
        const clr=isGiven?C.green:C.red;
        const pct=debt.amount>0?Math.round(((+debt.amount-(+debt.remaining_amount||0))/+debt.amount)*100):100;
        return(
          <div key={debt.id} className="fu" style={{background:C.bg2,border:`1.5px solid ${clr}30`,borderRadius:18,marginBottom:12,overflow:'hidden'}}>
            {/* Прогресс бар */}
            <div style={{height:4,background:C.bg3}}><div style={{width:`${pct}%`,height:'100%',background:clr+'90',transition:'width .3s'}}/></div>
            <div style={{padding:'14px 16px'}}>
              {/* Шапка */}
              <div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:10}}>
                <div style={{width:44,height:44,borderRadius:13,background:clr+'20',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>{isGiven?'💸':'💰'}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:16,fontWeight:900,marginBottom:2}}>{debt.name}</div>
                  <div style={{fontSize:11,fontWeight:700,color:clr,marginBottom:4}}>{isGiven?'Дал в долг':'Взял в долг'}</div>
                  {debt.description&&<div style={{fontSize:12,color:C.dim}}>📝 {debt.description}</div>}
                </div>
                <div style={{textAlign:'right',flexShrink:0}}>
                  <div style={{fontSize:22,fontWeight:900,color:clr}}>{fmt(+debt.remaining_amount||0)}</div>
                  <div style={{fontSize:10,color:C.dim}}>SM</div>
                  {+debt.remaining_amount<+debt.amount&&<div style={{fontSize:10,color:C.orange,marginTop:2}}>из {fmt(debt.amount)}</div>}
                </div>
              </div>

              {/* Бейджи */}
              <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
                <Badge color={C.muted}>{fmtD(debt.date)}</Badge>
                {pct>0&&pct<100&&<Badge color={C.orange}>оплачено {pct}%</Badge>}
                {debt.status==='paid'&&<Badge color={C.green}>✓ Закрыт</Badge>}
              </div>

              {/* Погашение */}
              {debt.status==='active'&&(
