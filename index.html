<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Test</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>body{background:#09090f;color:#eeeeff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style>
</head>
<body>
<div id="root"></div>
<script>
// NO BABEL - pure JS
const e = React.createElement;
function App() {
  const [n, setN] = React.useState(0);
  return e('div', {style:{textAlign:'center'}},
    e('div', {style:{fontSize:48,marginBottom:16}}, '🏪'),
    e('div', {style:{fontSize:22,fontWeight:900,marginBottom:8}}, 'KassaControl'),
    e('div', {style:{fontSize:14,color:'#6868a0',marginBottom:20}}, 'Тест работает!'),
    e('button', {
      onClick: () => setN(n+1),
      style:{padding:'12px 24px',borderRadius:12,background:'#4466ff',border:'none',color:'#fff',fontSize:16,fontWeight:800,cursor:'pointer'}
    }, 'Нажми: ' + n)
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(e(App, null));
</script>
</body>
</html>
